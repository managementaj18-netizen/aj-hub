.note{background:var(--skybg);border-radius:12px;padding:10px 12px;font-size:13px;color:#0c4a6e}
a.b{text-decoration:none}button.b,a.b{display:inline-flex;align-items:center;justify-content:center;gap:7px}svg.i{flex:none;vertical-align:-3px}nav button span{display:flex;justify-content:center;margin-bottom:2px}#drawer .mi span{display:flex;justify-content:center}h2 svg.i,h3 svg.i{vertical-align:-3px;margin-right:4px}

  $("lines").addEventListener("change",function(e){var r=e.target.closest(".line");if(!r||e.target.dataset.f!=="k")return;var l=draft.lines[+r.dataset.i],it=findItem(e.target.value);l.k=e.target.value;if(it){l.p=it.p;r.querySelector('[data-f="p"]').value=it.p}up()});

 }else if(tab==="inv"){
  var mm=invMonth||ymd().slice(0,7);$("inv_m").onchange=function(e){invMonth=e.target.value;render()};

 }else if(tab==="chat"){
  $("c_ord").onchange=function(e){chatOrder=e.target.value;render()};$("c_tpl").onchange=function(e){chatTpl=e.target.value;render()};$("c_lang").onchange=function(e){chatLang=e.target.value;render()};
  var o=O.filter(function(x){return x.id===chatOrder})[0];
  if(o)wireSend(o,tplText(o,chatTpl,chatLang||LANG),"c_");
 }else if(tab==="loc"){
  $("l_get").onclick=function(){getPos(function(p){myPos=p;render()},$("l_get"))};
  if(myPos){var u=mapsUrl(myPos.lat,myPos.lng),m=t("loc_share_msg",{who:S.name})+"\n"+u,enc=encodeURIComponent;
   $("l_share").onclick=function(){sharePlain(m)};$("l_tg").onclick=function(){window.open("https://t.me/share/url?url="+enc(u)+"&text="+enc(t("loc_share_msg",{who:S.name})),"_blank")};$("l_wa").onclick=function(){window.open("https://wa.me/?text="+enc(m),"_blank")}}
 }else if(tab==="set"){
  $("plist").addEventListener("click",function(e){var x=e.target.closest(".x");if(!x)return;readP();S.items.splice(+x.dataset.x,1);render()});
  $("addp").onclick=function(){readP();S.items.push({n:"",p:0});render()};
  $("savep").onclick=function(){readP();S.name=$("s_name").value.trim()||DEF.name;S.items=S.items.filter(function(i){return i.id||i.n.trim()});
   S.staff=$("s_staff").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);S.contact={tg:$("s_tg").value.trim(),wa:$("s_wa").value.trim(),phone:$("s_ph").value.trim()};
   save(K_SET,S);toast("✓ "+t("saved"));render()};
  $("pinb").onclick=function(){var v=$("s_pin").value.trim();if(!v){S.pin="";save(K_SET,S);toast(t("pin_cleared"));render();return}hash(v).then(function(h){S.pin=h;unlocked=true;save(K_SET,S);toast("✓ "+t("pin_set"));render()})};
  $("csv").onclick=exportCsv;$("bak").onclick=function(){dl("ajl-backup-"+ymd()+".json",JSON.stringify({settings:S,orders:O}),"application/json")};
  $("rst").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!Array.isArray(j.orders))throw 0;if(!confirm(t("replace_all")))return;S=j.settings||JSON.parse(JSON.stringify(DEF));S.staff=S.staff||[];S.contact=S.contact||{tg:"",wa:"",phone:""};S.pin=S.pin||"";S.lang=S.lang||LANG;fixItems();O=j.orders;save(K_SET,S);save(K_ORD,O);toast("✓ "+t("restored"));render()}catch(x){alert(t("invalid_file"))}};r.readAsText(f)};
 }}
function readP(){document.querySelectorAll("#plist .line").forEach(function(r){var it=S.items[+r.dataset.i];if(!it)return;var v=r.querySelector('[data-f="n"]').value;if(!(it.id&&v===iname(it))){delete it.id;it.n=v}it.p=+r.querySelector('[data-f="p"]').value||0});var n=$("s_name");if(n)S.name=n.value}
function saveOrder(){readDraft();var d=draft;
 if(!d.name.trim()){toast(t("enter_name"));$("f_name").focus();return}
 var lines=d.lines.filter(function(l){return l.k&&(+l.q)>0});if(!lines.length){toast(t("add_one"));return}
 var o={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),no:nextNo(),at:new Date().toISOString(),status:"received",name:d.name.trim(),phone:d.phone.trim(),room:d.room.trim(),idno:"",note:d.note.trim(),due:d.due,paid:d.acct?false:d.paid,acct:!!d.acct,staff:d.staff||"",loc:d.loc||null,lines:lines.map(function(l){var it=findItem(l.k);return{n:it?iname(it):l.k,q:+l.q,p:+l.p||0}})};
 O.push(o);save(K_ORD,O);draft=newDraft();tab="orders";flt="active";render();openOrder(o.id,true)}

function receipt(o,l){return'<div class="rc"><div style="text-align:center"><img src="logo-for-light.svg" alt="S&amp;A" style="width:56px;height:56px"></div><h1>'+esc(S.name)+'</h1><div class="c">'+esc(t(o.acct?"rc_slip":"receipt",null,l))+' · by Soramma</div><div class="c"><b>'+esc(o.no)+"</b> · "+fd(o.at)+"</div><hr>"+
 "<div><b>"+esc(o.name)+"</b>"+(o.phone?" · "+esc(o.phone):"")+(o.room?"<br>"+esc(o.room):"")+(o.staff?"<br>"+esc(t("rc_col",null,l))+": "+esc(o.staff):"")+(o.deliveredBy?"<br>"+esc(t("rc_del",null,l))+": "+esc(o.deliveredBy):"")+(o.recvName?"<br>"+esc(t("rc_rec",null,l))+": "+esc(o.recvName):"")+(o.due?"<br>"+esc(t("pickup_label",null,l))+": "+fd(o.due):"")+"</div>"+
 (o.acct?"<table><tr><th>"+esc(t("items",null,l))+"</th><th>"+esc(t("qty",null,l))+"</th></tr>"+o.lines.map(function(x){return"<tr><td>"+esc(x.n)+"</td><td>"+x.q+"</td></tr>"}).join("")+"<tr><th>"+esc(t("pieces",null,l))+"</th><th>"+pieces(o)+"</th></tr></table>":"<table><tr><th>"+esc(t("items",null,l))+"</th><th></th><th>$</th></tr>"+o.lines.map(function(x){return"<tr><td>"+esc(x.n)+"</td><td>"+x.q+" × "+money(x.p)+"</td><td>"+money(x.q*x.p)+"</td></tr>"}).join("")+"</table>")+
 (o.acct?'<div class="c"><b>'+esc(t("acct_note",null,l))+"</b></div>":'<div style="text-align:right;font-size:16px"><b>'+esc(t("total",null,l))+': '+money(total(o))+"</b></div><div style=\"text-align:right\">"+(o.paid?"✓ "+esc(t("paid",null,l)):esc(t("unpaid",null,l)))+"</div>")+(o.note?"<div>"+esc(o.note)+"</div>":"")+'<div class="c" style="margin-top:8px">'+esc(t("thanks",null,l))+'</div></div>'}
function wireSend(o,txt,p){var enc=encodeURIComponent,ph=phoneOf(o),base=location.href.split("#")[0];
 var g=function(i){return $(p+i)};
 if(g("share"))g("share").onclick=function(){if(navigator.share){navigator.share({title:o.no,text:txt}).catch(function(){})}else{copyTxt(txt);toast(t("copied"))}};
 if(g("tg"))g("tg").onclick=function(){window.open("https://t.me/share/url?url="+enc(base)+"&text="+enc(txt),"_blank")};
 if(g("wa"))g("wa").onclick=function(){window.open("https://wa.me/"+(ph||"")+"?text="+enc(txt),"_blank")};
 if(g("tgp"))g("tgp").onclick=function(){copyTxt(txt);toast(t("copied"));window.open("https://t.me/+"+ph,"_blank")};
 if(g("sms"))g("sms").onclick=function(){location.href="sms:+"+ph+"?&body="+enc(txt)};
 if(g("copy"))g("copy").onclick=function(){copyTxt(txt);toast(t("copied"))}}
var msgLang="";
function openOrder(id,isNew){var o=O.filter(function(x){return x.id===id})[0];if(!o)return;
 var i=FLOW.indexOf(o.status),nx=FLOW[i+1],ph=phoneOf(o),ml=msgLang||LANG;
 $("dbody").innerHTML=(isNew?'<div class="noprint pill paid" style="margin-bottom:8px">✓ '+esc(t("saved"))+'</div>':"")+receipt(o,ml)+
 '<div class="noprint" style="margin-top:12px"><div class="row"><span class="pill s-'+o.status+'">'+esc(t("st_"+o.status))+'</span>'+(o.staff?'<span class="muted">'+ic("user")+''+esc(o.staff)+"</span>":"")+'</div>'+
 '<div class="g2" style="margin-top:10px">'+(S.staff.length?'<label>'+esc(t("f_delby"))+'<select id="d_delby"><option value="">—</option>'+S.staff.map(function(x){return'<option'+(x===o.deliveredBy?" selected":"")+">"+esc(x)+"</option>"}).join("")+"</select></label>":"")+'<label>'+esc(t("f_recv"))+'<input id="d_recv" value="'+esc(o.recvName||"")+'"></label></div>'+
 '<div class="row" style="margin-top:8px">'+(nx?'<button class="b sm" id="d_next">'+esc(t("to_next",{s:t("st_"+nx)}))+"</button>":"")+'<button class="b alt sm" id="d_paid">'+esc(o.paid?t("mark_unpaid"):t("mark_paid"))+"</button>"+(o.loc||o.room?'<a class="b alt sm" target="_blank" rel="noopener" href="'+(o.loc?mapsUrl(o.loc.lat,o.loc.lng):mapsQ(o.room))+'">'+ic("nav")+''+esc(t("navigate"))+"</a>":"")+'</div>'+
 '<h3 style="margin:12px 0 6px">'+ic("send")+''+esc(t("send_share"))+'</h3><label>'+esc(t("rcpt_lang"))+'<select id="d_lang">'+LANGS.map(function(l){return'<option value="'+l[0]+'"'+(l[0]===ml?" selected":"")+">"+esc(l[1])+"</option>"}).join("")+'</select></label>'+
 '<div class="row"><button class="b sm" id="d_share">'+ic("send")+''+esc(t("share"))+'</button><button class="b tg sm" id="d_tg">'+ic("send")+'Telegram</button><button class="b wa sm" id="d_wa">'+ic("chat")+'WhatsApp</button></div>'+(ph?'<div class="row" style="margin-top:8px"><button class="b alt sm" id="d_tgp">'+ic("send")+''+esc(t("tg_to",{p:o.phone}))+'</button><button class="b alt sm" id="d_sms">'+ic("mail")+'SMS</button></div>':'')+'<div class="row" style="margin-top:8px"><button class="b alt sm" id="d_copy">'+ic("copy")+''+esc(t("copy"))+'</button></div>'+
 '<div class="row" style="margin-top:12px"><button class="b alt sm" id="d_print">'+ic("print")+''+esc(t("print"))+'</button><button class="b bad sm" id="d_del">'+ic("trash")+''+esc(t("del"))+'</button><span class="sp"></span><button class="b alt sm" id="d_close">'+esc(t("close"))+'</button></div></div>';
 if(!$("dlg").open)$("dlg").showModal();
 $("dbody").onclick=null;$("dlg").oncancel=null;
 $("d_close").onclick=function(){$("dlg").close()};
 if($("d_delby"))$("d_delby").onchange=function(e){o.deliveredBy=e.target.value;save(K_ORD,O);openOrder(id)};
 $("d_recv").onchange=function(e){o.recvName=e.target.value.trim();save(K_ORD,O);openOrder(id)};
 $("d_lang").onchange=function(e){msgLang=e.target.value;openOrder(id)};
 wireSend(o,rtext(o,ml),"d_");
 $("d_print").onclick=function(){var ti=document.title;document.title=o.no+" "+o.name;window.print();setTimeout(function(){document.title=ti},800)};
 $("d_paid").onclick=function(){o.paid=!o.paid;save(K_ORD,O);render();openOrder(id)};
 if(nx)$("d_next").onclick=function(){o.status=nx;save(K_ORD,O);render();openOrder(id)};
 $("d_del").onclick=function(){if(!confirm(t("confirm_delete")))return;O=O.filter(function(x){return x.id!==id});save(K_ORD,O);$("dlg").close();render()}}
function phoneOf(o){var d=String(o.phone||"").replace(/[^\d]/g,"");if(!d)return"";if(d.indexOf("855")===0)return d;if(d.charAt(0)==="0")return"855"+d.slice(1);return d}
function rtext(o,l){var L=[S.name+" — "+t("receipt",null,l)+" "+o.no,fd(o.at),"",o.name+(o.phone?" · "+o.phone:"")+(o.room?" · "+o.room:"")];
 if(o.acct){L[0]=S.name+" — "+t("rc_slip",null,l)+" "+o.no;o.lines.forEach(function(x){L.push("• "+x.n+"  × "+x.q)});L.push("",t("pieces",null,l)+": "+pieces(o),t("acct_note",null,l),t("status_label",null,l)+": "+t("st_"+o.status,null,l))}
 else{o.lines.forEach(function(x){L.push("• "+x.n+"  "+x.q+" × "+money(x.p)+" = "+money(x.q*x.p))});
 L.push("",t("total",null,l)+": "+money(total(o))+"  "+(o.paid?"✓ "+t("paid",null,l):"("+t("unpaid",null,l)+")"),t("status_label",null,l)+": "+t("st_"+o.status,null,l))}
 if(o.due)L.push(t("pickup_label",null,l)+": "+fd(o.due));if(o.note)L.push("📝 "+o.note);L.push("",t("thanks",null,l)+" 🙏");return L.join("\n")}
function copyTxt(s){try{navigator.clipboard.writeText(s)}catch(e){var a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(x){}a.remove()}}
function dl(n,s,m){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:m}));a.download=n;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800)}
function exportCsv(){var r=[["No","Date","Name","Phone","Room","ID","Collected by","Status","Paid","Total","Items","Note"]];O.forEach(function(o){r.push([o.no,o.at.slice(0,16).replace("T"," "),o.name,o.phone,o.room,o.idno,o.staff||"",o.status,o.paid?"yes":"no",total(o).toFixed(2),o.lines.map(function(l){return l.n+" x"+l.q}).join("; "),o.note])});
 dl("ajl-orders-"+ymd()+".csv","﻿"+r.map(function(x){return x.map(function(c){return'"'+String(c==null?"":c).replace(/"/g,'""')+'"'}).join(",")}).join("\n"),"text/csv")}
