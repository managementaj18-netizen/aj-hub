<!doctype html>
<html lang="km"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3d4752">
<title>Soramma Laundry</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf1;--card:#fff;--ink:#1f2933;--mute:#66727f;--line:#d5dce3;--hd:#3d4752;--ac:#0284c7;--sky:#0ea5e9;--skybg:#e0f2fe;--ok:#1f7a3a;--okbg:#e3f4e8;--warn:#a15c07;--warnbg:#fdf2dc;--bad:#b42318;--badbg:#fde8e6;--blue:#1d4ed8;--bluebg:#e0e9ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Kantumruy Pro",system-ui,sans-serif;font-size:15px;line-height:1.45}
header{background:var(--hd);color:#fff;border-bottom:3px solid var(--sky);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header .lg{width:38px;height:38px;flex:none}header b{font-size:18px;flex:1}header small{opacity:.7;font-weight:400}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;color:var(--mute);padding:6px 2px;cursor:pointer}
nav button span{display:block;font-size:22px;line-height:1.1}nav button.on{color:#0369a1;font-weight:700}nav button.on span{filter:none}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:10px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.b{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;cursor:pointer;min-height:46px}
button.b.alt{background:#fff;color:#0369a1;border:1px solid #b9d9ee}button.b.tg{background:#229ed9;color:#fff}button.b.wa{background:#1fa855;color:#fff}button.b.bad{background:var(--badbg);color:var(--bad)}button.b.sm{padding:8px 12px;min-height:36px;font-size:13px}
button.b.full{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.s-received{background:var(--warnbg);color:var(--warn)}.s-washing{background:var(--bluebg);color:var(--blue)}.s-ready{background:var(--okbg);color:var(--ok)}.s-delivered{background:#eee;color:#555}
.paid{background:var(--okbg);color:var(--ok)}.unpaid{background:var(--badbg);color:var(--bad)}
.ord{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--sky);background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px #0001;font:inherit;cursor:pointer}
.ord small{color:var(--mute)}
.line{display:grid;grid-template-columns:1fr 70px 70px 28px;gap:6px;align-items:center;margin-bottom:6px}
.line input,.line select{margin:0;padding:9px 8px;font-size:15px}.line .x{border:0;background:none;font-size:18px;color:var(--bad);cursor:pointer}
.tot{font-size:20px;font-weight:700;text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font:inherit;font-size:13px;white-space:nowrap}.chips button.on{background:var(--sky);color:#fff;border-color:var(--sky)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:var(--skybg);border-radius:14px;padding:12px}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--mute)}
.muted{color:var(--mute)}.hide{display:none!important}
dialog{border:0;border-radius:18px;padding:0;max-width:440px;width:calc(100% - 24px);max-height:92vh;overflow:auto}dialog::backdrop{background:#0007}
.dbody{padding:16px}
.rc{font-family:system-ui,"Kantumruy Pro",sans-serif;font-size:13px}.rc h1{font-size:18px;margin:0;text-align:center}.rc .c{text-align:center;color:#555}
.rc table{width:100%;border-collapse:collapse;margin:8px 0}.rc td,.rc th{padding:4px 2px;border-bottom:1px dashed #bbb;text-align:left}.rc td:last-child,.rc th:last-child{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--hd);color:#fff;padding:10px 16px;border-radius:12px;z-index:50}
header button.ic{border:0;background:none;color:#fff;font-size:24px;line-height:1;padding:6px;cursor:pointer}
#ov{position:fixed;inset:0;background:#0007;z-index:20}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:#fff;z-index:21;transform:translateX(-102%);transition:transform .2s;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);overflow:auto}
#drawer.open{transform:none}
#drawer .dh{background:var(--hd);color:#fff;border-bottom:3px solid var(--sky);padding:calc(16px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:10px}
#drawer .dh img{width:44px;height:44px}#drawer .dh b{flex:1;font-size:17px}
#drawer .mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:16px;padding:14px 18px;cursor:pointer;color:var(--ink)}
#drawer .mi.on{background:var(--skybg);color:#0369a1;font-weight:700}
#drawer .mi span{font-size:20px;width:26px;text-align:center}
#drawer hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
#drawer .dl{padding:8px 18px}
.langs button{display:block;width:100%;text-align:left;font:inherit;font-size:17px;padding:13px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.langs button.on{border-color:var(--sky);background:var(--skybg);font-weight:700}
.note{background:var(--skybg);border-radius:12px;padding:10px 12px;font-size:13px;color:#0c4a6e}
a.b{display:inline-flex;align-items:center;text-decoration:none}
@media print{header,nav,main,#drawer,#ov,.toast,.noprint{display:none!important}body{background:#fff}dialog{position:static;box-shadow:none;max-width:80mm;margin:0;width:auto}dialog::backdrop{display:none}@page{margin:6mm}}
</style></head><body>
<header><button class="ic" id="hm" aria-label="Menu">☰</button><img src="logo-for-dark.svg" alt="S&amp;A" class="lg"><b id="biz">Soramma Laundry</b><button class="ic" id="hl" aria-label="Language">🌐</button></header>
<div id="ov" class="hide"></div><aside id="drawer"></aside>
<main id="app"></main>
<nav id="nav"></nav>
<dialog id="dlg"><div class="dbody" id="dbody"></div></dialog>
<script src="i18n.js"></script>
<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var T=window.AJL_T,LANGS=window.AJL_LANGS;
var K_ORD="ajl_orders",K_SET="ajl_settings",mem={};
function load(k,d){try{var v=localStorage.getItem(k);if(v!=null)return JSON.parse(v)}catch(e){} return k in mem?JSON.parse(mem[k]):d}
function save(k,v){var s=JSON.stringify(v);try{localStorage.setItem(k,s);delete mem[k];return true}catch(e){mem[k]=s;toast(t("storage_blocked"));return false}}
var DEF={name:"Soramma Laundry",lang:"",staff:[],contact:{tg:"",wa:"",phone:""},pin:"",items:[{id:"kg",p:1.5,u:"kg"},{id:"shirt",p:0.5,u:"pc"},{id:"trousers",p:0.7,u:"pc"},{id:"dress",p:1.2,u:"pc"},{id:"sheet",p:1.5,u:"pc"},{id:"towel",p:0.5,u:"pc"}]};
var S=load(K_SET,null),O=load(K_ORD,[]);
if(!S)S=JSON.parse(JSON.stringify(DEF));
if(S.name==="A&J Laundry"||S.name==="Sorama Laundry")S.name=DEF.name;
S.staff=S.staff||[];S.contact=S.contact||{tg:"",wa:"",phone:""};S.pin=S.pin||"";S.lang=S.lang||"";
var OLDN={"បោក+បត់ ក្នុងមួយគីឡូ / Wash & fold per kg":"kg","អាវ / Shirt":"shirt","ខោ / Trousers":"trousers","រ៉ូប / Dress":"dress","ក្រណាត់គ្រែ / Bed sheet":"sheet","កន្សែង / Towel":"towel"};
S.items.forEach(function(it){if(!it.id&&OLDN[it.n]){it.id=OLDN[it.n];delete it.n}});
save(K_SET,S);
var LANG=S.lang||"en";
function t(k,v,l){var s=((T[l||LANG]||{})[k]);if(s==null)s=T.en[k];if(s==null)s=k;if(v)for(var x in v)s=s.split("{"+x+"}").join(v[x]);return s}
var FLOW=["received","washing","ready","delivered"];
var OWN={staff:1,report:1,set:1};
var unlocked=false;
function isOwner(){return !S.pin||unlocked}
var tab="new",flt="active",q="",draft=null,chatOrder="",chatTpl="received",chatLang="",myPos=null;
var money=function(n){return"$"+(Math.round((+n||0)*100)/100).toFixed(2)};
var ymd=function(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
var fd=function(s){if(!s)return"";var d=new Date(s);return isNaN(d)?s:d.toLocaleString(LANG==="zh"?"zh-CN":LANG==="km"?"en-GB":LANG,{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})};
function toast(m){var e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},2600)}
function total(o){return o.lines.reduce(function(s,l){return s+(+l.q||0)*(+l.p||0)},0)}
function nextNo(){var p="L"+ymd().replace(/-/g,"").slice(2),n=O.filter(function(o){return o.no.indexOf(p)===0}).length+1;return p+"-"+String(n).padStart(3,"0")}
var ikey=function(it){return it.id||it.n};
var iname=function(it){return it.id?t("item_"+it.id):it.n};
function findItem(k){return S.items.filter(function(it){return ikey(it)===k})[0]}
function newDraft(){var f=S.items[0];return{name:"",phone:"",room:"",idno:"",note:"",due:"",paid:false,staff:"",loc:null,lines:[{k:f?ikey(f):"",q:1,p:f?f.p:0}]}}
draft=newDraft();
function hash(s){if(!window.crypto||!crypto.subtle)return Promise.resolve("p"+s);return crypto.subtle.digest("SHA-256",new TextEncoder().encode("soramma|"+s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return("0"+x.toString(16)).slice(-2)}).join("")})}
var mapsUrl=function(lat,lng){return"https://www.google.com/maps?q="+lat+","+lng};
var mapsQ=function(s){return"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s)};
function sharePlain(txt){if(navigator.share){navigator.share({text:txt}).catch(function(){})}else{copyTxt(txt);toast("📋 "+t("copied"))}}

var MENU=[["new","➕","nav_new"],["orders","🧺","nav_orders"],["chat","💬","nav_chat"],["loc","📍","nav_location"],["staff","👥","m_staff"],["report","📊","m_report"],["set","⚙️","m_settings"]];
function nav(){var tt=[["new","➕","nav_new"],["orders","🧺","nav_orders"],["chat","💬","nav_chat"],["loc","📍","nav_location"]];
 $("nav").innerHTML=tt.map(function(x){return'<button class="'+(tab===x[0]?"on":"")+'" data-t="'+x[0]+'"><span>'+x[1]+"</span>"+esc(t(x[2]))+"</button>"}).join("")+'<button data-t="__menu"><span>☰</span>'+esc(t("nav_menu"))+"</button>";
 $("nav").onclick=function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.t==="__menu"){openDrawer();return}tab=b.dataset.t;render()}}
function drawer(){var d=$("drawer");
 d.innerHTML='<div class="dh"><img src="logo-for-dark.svg" alt=""><b>'+esc(S.name)+'</b><button class="ic" id="dx" aria-label="'+esc(t("close"))+'" style="border:0;background:none;color:#fff;font-size:22px;cursor:pointer">✕</button></div>'+
 MENU.filter(function(m){return isOwner()||!OWN[m[0]]}).map(function(m){return'<button class="mi'+(tab===m[0]?" on":"")+'" data-t="'+m[0]+'"><span>'+m[1]+"</span>"+esc(t(m[2]))+"</button>"}).join("")+
 '<hr><button class="mi" data-t="__lang"><span>🌐</span>'+esc(t("language"))+" · "+esc((LANGS.filter(function(l){return l[0]===LANG})[0]||["","English"])[1])+"</button>"+
 (S.pin?'<button class="mi" data-t="__mode"><span>'+(isOwner()?"🔒":"🔑")+"</span>"+esc(isOwner()?t("m_staff_mode"):t("m_owner_mode"))+"</button>":"")+
 '<div class="dl muted" style="font-size:12px">'+esc(t(isOwner()?"mode_owner":"mode_staff"))+" · Soramma</div>";
 d.onclick=function(e){var b=e.target.closest("button");if(!b)return;
  if(b.id==="dx"){closeDrawer();return}
  var k=b.dataset.t;if(!k)return;closeDrawer();
  if(k==="__lang"){langDialog(false);return}
  if(k==="__mode"){if(isOwner()){unlocked=false;if(OWN[tab])tab="new";render();toast("🔒 "+t("mode_staff"))}else askPin();return}
  tab=k;render()}}
function openDrawer(){drawer();$("ov").classList.remove("hide");$("drawer").classList.add("open")}
function closeDrawer(){$("ov").classList.add("hide");$("drawer").classList.remove("open")}
function askPin(){var p=prompt(t("enter_pin"));if(p==null)return;hash(p).then(function(h){if(h===S.pin){unlocked=true;render();toast("🔑 "+t("mode_owner"))}else toast(t("wrong_pin"))})}
function langDialog(first){$("dbody").innerHTML='<h2>🌐 '+(first?"Language · ភាសា · 语言 · Langue · Язык · 언어":esc(t("choose_language")))+'</h2><div class="langs">'+LANGS.map(function(l){return'<button data-l="'+l[0]+'" class="'+(l[0]===LANG&&!first?"on":"")+'">'+esc(l[1])+"</button>"}).join("")+"</div>"+(first?"":'<div class="row"><span class="sp"></span><button class="b alt sm" id="lc">'+esc(t("close"))+"</button></div>");
 if(!$("dlg").open)$("dlg").showModal();
 $("dbody").onclick=function(e){var b=e.target.closest("button");if(!b)return;if(b.id==="lc"){$("dlg").close();return}if(b.dataset.l){setLang(b.dataset.l);$("dlg").close();$("dbody").onclick=null}};
 $("dlg").oncancel=first?function(e){e.preventDefault()}:null}
function setLang(l){LANG=l;S.lang=l;chatLang="";save(K_SET,S);document.documentElement.lang=l;render()}

function lineHtml(l,i){var opts=S.items.map(function(it){return'<option value="'+esc(ikey(it))+'"'+(ikey(it)===l.k?" selected":"")+">"+esc(iname(it))+"</option>"}).join("");
 if(l.k&&!findItem(l.k))opts='<option selected value="'+esc(l.k)+'">'+esc(l.k)+"</option>"+opts;
 return'<div class="line" data-i="'+i+'"><select data-f="k">'+opts+'</select><input data-f="q" type="number" min="0" step="any" inputmode="decimal" value="'+esc(l.q)+'" aria-label="qty"><input data-f="p" type="number" min="0" step="any" inputmode="decimal" value="'+esc(l.p)+'" aria-label="price"><button class="x" data-x="'+i+'" type="button">✕</button></div>'}

function vNew(){var d=draft;
 return'<div class="card"><h2>'+esc(t("new_title"))+'</h2>'+
 '<div class="g2"><label>'+esc(t("f_name"))+' *<input id="f_name" value="'+esc(d.name)+'" autocomplete="off"></label><label>'+esc(t("f_phone"))+'<input id="f_phone" type="tel" value="'+esc(d.phone)+'"></label></div>'+
 '<div class="g2"><label>'+esc(t("f_room"))+'<input id="f_room" value="'+esc(d.room)+'"></label><label>'+esc(t("f_pickup"))+'<input id="f_due" type="datetime-local" value="'+esc(d.due)+'"></label></div>'+
 '<div class="row" style="margin-bottom:10px"><button class="b alt sm" id="pinloc" type="button">'+esc(d.loc?t("loc_pinned"):t("pin_loc"))+"</button></div>"+
 '<label>'+esc(t("f_idno"))+'<input id="f_idno" value="'+esc(d.idno)+'" autocomplete="off"></label>'+
 (S.staff.length?'<label>'+esc(t("f_staff"))+'<select id="f_staff"><option value="">'+esc(t("f_unassigned"))+"</option>"+S.staff.map(function(s){return'<option'+(s===d.staff?" selected":"")+'>'+esc(s)+"</option>"}).join("")+"</select></label>":"")+
 '<h3>'+esc(t("items"))+' <small class="muted">('+esc(t("items_hint"))+')</small></h3><div id="lines">'+d.lines.map(lineHtml).join("")+'</div>'+
 '<button class="b alt sm" id="addl" type="button">'+esc(t("add_item"))+'</button>'+
 '<label style="margin-top:12px">'+esc(t("note"))+'<textarea id="f_note" rows="2">'+esc(d.note)+'</textarea></label>'+
 '<div class="row"><label style="margin:0"><input type="checkbox" id="f_paid" style="width:auto;margin-right:6px"'+(d.paid?" checked":"")+'>'+esc(t("paid"))+'</label><span class="sp"></span><div class="tot" id="tot">'+money(total(d))+'</div></div>'+
 '<button class="b full" id="save" style="margin-top:12px">💾 '+esc(t("save_receipt"))+'</button></div>'}

function filtered(){var qq=q.trim().toLowerCase();return O.slice().sort(function(a,b){return b.at.localeCompare(a.at)}).filter(function(o){
 if(flt==="active"&&o.status==="delivered")return false;if(flt!=="active"&&flt!=="all"&&o.status!==flt)return false;
 return!qq||[o.no,o.name,o.phone,o.room].join(" ").toLowerCase().indexOf(qq)>=0})}
function vOrders(){var f=[["active",t("flt_active")],["all",t("flt_all")]].concat(FLOW.map(function(s){return[s,t("st_"+s)]}));
 var L=filtered();
 return'<input id="q" placeholder="🔎 '+esc(t("search"))+'" value="'+esc(q)+'"><div class="chips" style="margin-top:8px">'+f.map(function(x){return'<button data-f="'+x[0]+'" class="'+(flt===x[0]?"on":"")+'">'+esc(x[1])+"</button>"}).join("")+"</div>"+
 (L.length?L.map(function(o){return'<button class="ord" data-id="'+o.id+'"><div class="row"><b>'+esc(o.name)+'</b><span class="sp"></span><span class="pill s-'+o.status+'">'+esc(t("st_"+o.status))+'</span></div><small>'+esc(o.no)+" · "+esc(o.room||"")+" · "+fd(o.at)+(o.staff?" · 👤 "+esc(o.staff):"")+'</small><div class="row"><b>'+money(total(o))+'</b><span class="pill '+(o.paid?"paid":"unpaid")+'">'+esc(o.paid?t("paid"):t("unpaid"))+"</span></div></button>"}).join(""):'<p class="muted" style="text-align:center;padding:30px 0">'+esc(t("nothing"))+'</p>')}

function vReport(){var tt=ymd(),m=tt.slice(0,7);
 var S1=function(f){var L=O.filter(f);return{n:L.length,paid:L.filter(function(o){return o.paid}).reduce(function(s,o){return s+total(o)},0),un:L.filter(function(o){return!o.paid}).reduce(function(s,o){return s+total(o)},0)}};
 var d=S1(function(o){return o.at.slice(0,10)===tt}),mo=S1(function(o){return o.at.slice(0,7)===m}),all=O.filter(function(o){return o.status!=="delivered"}).length;
 var card=function(h,x){return'<div class="card"><h2>'+h+'</h2><div class="stats" style="margin:0"><div class="stat"><b>'+x.n+'</b><span>'+esc(t("rep_orders"))+'</span></div><div class="stat"><b>'+money(x.paid)+'</b><span>'+esc(t("rep_paid"))+'</span></div><div class="stat"><b>'+money(x.un)+'</b><span>'+esc(t("rep_unpaid"))+'</span></div></div></div>'};
 return card("📅 "+esc(t("rep_today")),d)+card("🗓 "+esc(t("rep_month")),mo)+'<div class="card"><b>'+all+'</b> '+esc(t("rep_notdel"))+'</div>'}

function vStaff(){var tt=ymd(),names=S.staff.slice(),un=O.filter(function(o){return!o.staff&&o.status!=="delivered"}).length;
 var row=function(n,act,td){return'<div class="card"><div class="row"><b>👤 '+esc(n)+'</b></div><div class="stats" style="margin:8px 0 0;grid-template-columns:1fr 1fr"><div class="stat"><b>'+act+"</b><span>"+esc(t("staff_active"))+'</span></div><div class="stat"><b>'+td+"</b><span>"+esc(t("staff_today"))+"</span></div></div></div>"};
 var h='<div class="card"><h2>👥 '+esc(t("staff_title"))+"</h2>"+(names.length?"":'<p class="muted">'+esc(t("staff_none"))+"</p>")+"</div>";
 names.forEach(function(n){var L=O.filter(function(o){return o.staff===n});h+=row(n,L.filter(function(o){return o.status!=="delivered"}).length,L.filter(function(o){return o.at.slice(0,10)===tt}).length)});
 h+=row(t("staff_unassigned"),un,O.filter(function(o){return!o.staff&&o.at.slice(0,10)===tt}).length);
 return h}

  var up=function(){$("tot").textContent=money(total(draft))};
