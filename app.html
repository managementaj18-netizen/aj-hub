<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>A&J Kampot Boutique</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14254a;--navy2:#1f3a73;--ink:#1b1f2a;--mute:#6b7280;--line:#e6e8ee;--bg:#f6f7fa;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Kantumruy Pro",system-ui,sans-serif;font-size:15px}
body.km{font-family:"Kantumruy Pro",Inter,system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{height:34px}
header .t{flex:1;line-height:1.15}
header .t b{display:block;font-size:15px;color:var(--navy)}
header .t span{font-size:12px;color:var(--mute)}
.lang{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer}
main{padding:16px;padding-bottom:90px;max-width:560px;margin:0 auto}
.page{display:none}.page.on{display:block}
h2{font-size:19px;margin:4px 0 4px;color:var(--navy)}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
.hero b{font-size:18px;display:block;margin-bottom:4px}
.hero p{margin:0;font-size:13px;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.tile .i{font-size:26px}
.tile b{display:block;margin-top:6px;font-size:14px;color:var(--navy)}
.tile span{font-size:12px;color:var(--mute)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.pics{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pics::-webkit-scrollbar{display:none}
.pics img{width:100%;flex:0 0 100%;height:200px;object-fit:cover;scroll-snap-align:start;background:#e5e7eb}
.cb{padding:12px 14px}
.cb .row{display:flex;justify-content:space-between;align-items:baseline}
.cb h3{margin:0;font-size:16px}
.price{font-weight:700;color:var(--navy);font-size:18px}
.price s{color:var(--mute);font-weight:400;font-size:13px;margin-right:4px}
.meta{font-size:13px;color:var(--mute);margin:4px 0 10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-align:center;text-decoration:none}
.btn.p{background:var(--navy);color:#fff}
.btn.s{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn+.btn{margin-top:8px}
.btn:disabled{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input,select,textarea{width:100%;border:1px solid #d5d9e2;border-radius:10px;padding:11px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.note{background:#fff7e6;border:1px solid #f5d38a;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;user-select:none}
.item.on{border-color:var(--navy);background:#eef2fb}
.item .e{font-size:20px}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.photos .ph{width:76px;height:76px;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line)}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph b{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:grid;place-items:center;cursor:pointer}
.addph{width:76px;height:76px;border:1.5px dashed #aab;border-radius:10px;display:grid;place-items:center;font-size:28px;color:var(--navy);cursor:pointer;background:#fff}
.list{background:#fff;border:1px solid var(--line);border-radius:14px}
.list .li{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;text-decoration:none;color:inherit}
.list .li:last-child{border:0}
.list .li .e{font-size:22px;width:28px;text-align:center}
.list .li b{display:block;font-size:14px}
.list .li span{font-size:12px;color:var(--mute)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;border:0;background:none;font:inherit;font-size:11px;color:var(--mute);padding:4px 0;cursor:pointer}
nav button .e{display:block;font-size:20px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--navy);font-weight:600}
nav button.on .e{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9;max-width:90%;text-align:center}
.done{text-align:center;padding:30px 10px}
.done .e{font-size:54px}
.req{color:var(--bad)}
.en{display:block;font-size:.8em;font-weight:500;opacity:.72;line-height:1.25}
.btn .en{opacity:.8}
nav .en{font-size:9px}
.item .en{font-size:11px}
h2 .en{font-size:13px;font-weight:600}
.stay{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 12px 12px;margin-bottom:12px}
.stay .three{display:grid;grid-template-columns:1fr 1fr 90px;gap:8px}
.stay label{margin-top:8px}
.tot{font-size:13px;color:var(--mute);margin:-4px 0 10px}
.tot b{color:var(--ink)}
.modal{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 8px;color:var(--navy)}
.sum{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
.code{border:1.5px dashed var(--navy);border-radius:12px;padding:10px 12px;margin:12px 0;display:flex;align-items:center;justify-content:space-between}
.code b{font-size:20px;letter-spacing:1px;font-family:ui-monospace,monospace}
.code button{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
ol.steps{padding-left:18px;font-size:13px;margin:8px 0 14px}
.qrbox{text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.qrbox .bank{font-weight:700;color:#0b4a8b}
.qrbox #qr img,.qrbox #qr svg{width:220px;height:220px}
.qrbox .amt{font-size:20px;font-weight:700;color:var(--navy);margin-top:6px}
</style>
</head>

  qsa('[data-t]').forEach(e => { if (e.tagName==='OPTION') e.textContent = tx(e.dataset.t); else e.innerHTML = tb(e.dataset.t); });
  qsa('[data-tp]').forEach(e => { e.placeholder = t(e.dataset.tp); });
  const n = tgUser ? (tgUser.first_name||'') : '';
  qs('#hello').textContent = tx('hi') + (n ? ', ' + n : '') + ' 👋';
  renderRooms(); renderItems(); if (qs('#sbRoom').options.length) { fillRoomSelect(); sbCalc(); }
}
qs('#langBtn').onclick = () => { lang = lang==='km'?'en':'km'; try{localStorage.setItem('aj_lang',lang)}catch(e){} applyLang(); };

function go(p){
  qsa('.page').forEach(e => e.classList.toggle('on', e.id==='p-'+p));
  qsa('nav button').forEach(b => b.classList.toggle('on', b.dataset.go===p));
  window.scrollTo(0,0);
  if (tg && tg.BackButton) { p==='home' ? tg.BackButton.hide() : tg.BackButton.show(); }
}
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go); });
if (tg && tg.BackButton) tg.BackButton.onClick(() => go('home'));

function openLink(url){
  if (tg && tg.openLink && !url.startsWith('https://t.me')) { tg.openLink(url); return; }
  if (tg && tg.openTelegramLink && url.startsWith('https://t.me')) { tg.openTelegramLink(url); return; }
  window.open(url, '_blank');
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[target=_blank]');
  if (a && tg) { e.preventDefault(); openLink(a.href); }
});

// ---- dates ----
const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const addDays = (s,n) => { const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const nightsOf = (a,b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
const money = n => '$' + (Math.round(n*100)/100).toFixed(2).replace(/\.00$/,'');
const today = iso(new Date());
qs('#cin').value = today; qs('#cout').value = addDays(today,1);
qs('#cin').min = today; qs('#cout').min = addDays(today,1);
function stay(){
  let a = qs('#cin').value || today, b = qs('#cout').value;
  if (!b || nightsOf(a,b) < 1) { b = addDays(a,1); qs('#cout').value = b; }
  qs('#cout').min = addDays(a,1);
  return { a, b, n: nightsOf(a,b), g: Math.max(1, +qs('#gst').value || 1) };
}
['#cin','#cout','#gst'].forEach(id => qs(id).addEventListener('change', renderRooms));

function renderRooms(){
  const st = stay();
  qs('#roomList').innerHTML = ROOMS.map(r => `
   <div class="card">
    <div class="pics">${r.pics.map(p=>`<img loading="lazy" src="${IMG+p}.jpg" alt="">`).join('')}</div>
    <div class="cb">
     <div class="row"><h3>${dual(r.km, r.en)}</h3><div class="price"><s>$${r.was}</s>$${r.price}<small style="font-size:12px;font-weight:500;color:var(--mute)"> ${t('perNight')}</small></div></div>
     <div class="meta">${dual(r.kmM, r.enM)} · ${r.pics.length} 📷</div>
     <div class="tot">${tx('total')} ${st.n} ${st.n>1?t('nights'):t('night')}: <b>${money(r.price*st.n)}</b> · ${tx('depositL')}: <b>${money(r.price*st.n/2)}</b></div>
     <button class="btn p" data-book="${r.id}">${tb('bookNow')}</button>
     <button class="btn s" data-staff="${r.id}">${tb('askStaff')}</button>
    </div>
   </div>`).join('') + `<p class="sub">${tb('deposit')}</p>`;
}

// ---- Book now (instant, Nobeds) ----
let cur = null;
function nobedsUrl(r, st){ return `${NOBEDS}?arrdate=${st.a}&depdate=${st.b}&guests=${Math.min(st.g, r.max)}&roomselect=${r.rid}`; }
function openBookModal(id){
  cur = ROOMS.find(r => r.id===id); const st = stay();
  qs('#bmTitle').innerHTML = dual(cur.km, cur.en);
  qs('#bmSum').innerHTML = `<div><span>${t('fCin')} → ${t('fCout')}</span><b>${st.a} → ${st.b}</b></div><div><span>${t('fGuests')}</span><b>${st.g}</b></div><div><span>${t('total')} (${st.n} ${st.n>1?t('nights'):t('night')})</span><b>${money(cur.price*st.n)}</b></div>`;
  qs('#bmCode').textContent = 'PROMO_' + cur.id;
  qs('#bmSt3').innerHTML = tb('st3').replace(/\{T\}/g, money(cur.price*st.n));
  qs('#bookModal').classList.add('on');
}
async function copyCode(){
  const c = qs('#bmCode').textContent;
  try { await navigator.clipboard.writeText(c); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=c; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy')}catch(_){} ta.remove(); }
  toast(tx('copied') + ': ' + c);
}
qs('#bmCopy').onclick = copyCode;
qs('#bmGo').onclick = async () => { await copyCode(); openLink(nobedsUrl(cur, stay())); };
qs('#bmClose').onclick = () => qs('#bookModal').classList.remove('on');
qs('#bmStaff').onclick = () => { qs('#bookModal').classList.remove('on'); openStaff(cur.id); };
qs('#bookModal').addEventListener('click', e => { if (e.target.id==='bookModal') qs('#bookModal').classList.remove('on'); });

// ---- Ask our team (in-app form + KHQR + receipt) ----
function fillRoomSelect(sel){
  const v = qs('#sbRoom').value;
  qs('#sbRoom').innerHTML = ROOMS.map(r => `<option value="${r.id}">${lang==='km'?r.km+' / '+r.en:r.en} — $${r.price}${t('perNight')}</option>`).join('');
  qs('#sbRoom').value = sel || v || 'SR';
}
function sbCalc(){
  const r = ROOMS.find(x => x.id===qs('#sbRoom').value) || ROOMS[0];
  let a = qs('#sbCin').value, b = qs('#sbCout').value;
  if (a && (!b || nightsOf(a,b) < 1)) { b = addDays(a,1); qs('#sbCout').value = b; }
  const n = a && b ? nightsOf(a,b) : 0;
  qs('#sbSum').innerHTML = `<div><span>${n} ${n>1?t('nights'):t('night')} × $${r.price}</span><b>${money(r.price*n)}</b></div><div><span>${tx('depositL')}</span><b>${money(r.price*n/2)}</b></div>`;
  qs('#sbDep').textContent = n ? money(r.price*n/2) : '';
  return { r, a, b, n };
}
['#sbRoom','#sbCin','#sbCout'].forEach(id => qs(id).addEventListener('change', sbCalc));
function openStaff(id){
  const st = stay();
  fillRoomSelect(id);
  qs('#sbCin').value = st.a; qs('#sbCout').value = st.b; qs('#sbGst').value = st.g;
  qs('#sbCin').min = today;
  sbCalc(); go('staffbook');
}
function drawQR(){
  try { const q = qrcode(0,'M'); q.addData(KHQR); q.make(); qs('#qr').innerHTML = q.createSvgTag({cellSize:4, margin:2, scalable:true}); }
  catch(e){ qs('#qr').textContent = 'KHQR'; }
}
document.addEventListener('click', e => {
  const bk = e.target.closest('[data-book]'), sf = e.target.closest('[data-staff]');
  if (bk) openBookModal(bk.dataset.book);
  if (sf) openStaff(sf.dataset.staff);
});

function renderItems(){
  const mk = (el, arr) => { const keep = new Set(qsa('#'+el+' .item.on').map(x=>x.dataset.v));
    qs('#'+el).innerHTML = arr.map(a => `<div class="item${keep.has(a[1])?' on':''}" data-v="${a[1]}"><span class="e">${a[0]}</span><span>${dual(a[2], a[1])}</span></div>`).join(''); };
  mk('itBorrow', BORROW); mk('itBuy', BUY); mk('itProb', PROB);
}
document.addEventListener('click', e => { const it = e.target.closest('.item'); if (it) it.classList.toggle('on'); });

// ---- photos (compressed in browser) ----
const photoSets = { phCheck: [], phReq: [], phBook: [] };
function initPhotos(id, max){
  const box = qs('#'+id);
  const input = document.createElement('input'); input.type='file'; input.accept='image/*'; input.multiple=true; input.style.display='none';
  document.body.appendChild(input);
  const draw = () => {
    box.innerHTML = photoSets[id].map((p,i)=>`<div class="ph"><img src="${p.url}"><b data-del="${id}:${i}">✕</b></div>`).join('') +
      (photoSets[id].length < max ? `<div class="addph" data-add="${id}">＋</div>` : '');
  };
  box.addEventListener('click', e => {
    if (e.target.dataset.add) input.click();
    if (e.target.dataset.del) { photoSets[id].splice(+e.target.dataset.del.split(':')[1],1); draw(); }
  });
  input.onchange = async () => {
    for (const f of [...input.files].slice(0, max - photoSets[id].length)) {
      try { const blob = await shrink(f); photoSets[id].push({blob, url: URL.createObjectURL(blob)}); } catch(e){}
    }
    input.value=''; draw();
  };
  draw();
}
function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const m = 1600, s = Math.min(1, m/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', 0.82);
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
initPhotos('phCheck', 8); initPhotos('phReq', 3);

function toast(m){ const el=qs('#toast'); el.textContent=m; el.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display='none',3500); }

async function send(kind, text, photos, btn, doneKey, data){
  btn.disabled = true; const old = btn.innerHTML; btn.textContent = tx('sending');
  try {
    const fd = new FormData();
    fd.append('kind', kind); fd.append('text', text);
    if (data) fd.append('data', JSON.stringify(data));
    if (tg && tg.initData) fd.append('initData', tg.initData);
    photos.forEach((p,i) => fd.append('photo'+i, p.blob, 'photo'+i+'.jpg'));
    const r = await fetch(API, { method:'POST', body: fd });
    const j = await r.json().catch(()=>({}));
    if (!r.ok || !j.ok) throw new Error(j.error || r.status);
    qs('#doneMsg').innerHTML = tb(doneKey); go('done');
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    return true;
  } catch(err) {
    toast(tx('fail'));
    setTimeout(()=> openLink(TG_CHAT), 1200);
    return false;
  } finally { btn.disabled = false; btn.innerHTML = old; }
}
const who = () => tgUser ? `\nTelegram: ${tgUser.first_name||''} ${tgUser.last_name||''}${tgUser.username?' @'+tgUser.username:''} (id ${tgUser.id})` : '';

qs('#fCheck').onsubmit = async e => {
  e.preventDefault();
  if (!photoSets.phCheck.length) { toast(tx('needDoc')); return; }
  const d = Object.fromEntries(new FormData(e.target));
  const txt = `📝 EARLY CHECK-IN\n` +
   `Name: ${d.name}\nNationality: ${d.nationality}\nPassport/ID: ${d.passport}\nPhone: ${d.phone}\nBooked via: ${d.source}\n` +
   `Arrival: ${d.arrival} ${d.time||''}\nNights: ${d.nights} · Guests: ${d.guests}\nComing by: ${d.transport}` +
   (d.others ? `\nOther guests:\n${d.others}` : '') + (d.note ? `\nNote: ${d.note}` : '') + who();
  const data = Object.assign({}, d, tgUser ? { tg: { id: tgUser.id, name: ((tgUser.first_name||'')+' '+(tgUser.last_name||'')).trim(), username: tgUser.username||'' } } : {});
  if (await send('checkin', txt, photoSets.phCheck, e.target.querySelector('button[type=submit]'), 'doneCheck', data)) {
    e.target.reset(); photoSets.phCheck.length = 0; initPhotos('phCheck', 8);
  }
};
qs('#fReq').onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  const pick = id => qsa('#'+id+' .item.on').map(x=>x.dataset.v);
  const b = pick('itBorrow'), y = pick('itBuy'), p = pick('itProb');
  if (!b.length && !y.length && !p.length && !d.note) { toast(tx('needItem')); return; }
  const txt = `🧺 ROOM ${d.room} REQUEST` + (d.name ? ` — ${d.name}` : '') +
   (b.length ? `\nBorrow: ${b.join(', ')}` : '') + (y.length ? `\nBuy/Service: ${y.join(', ')}` : '') +
   (p.length ? `\n⚠️ Problem: ${p.join(', ')}` : '') + (d.note ? `\nNote: ${d.note}` : '') + who();
  if (await send('request', txt, photoSets.phReq, e.target.querySelector('button[type=submit]'), 'doneReq')) {
    e.target.reset(); qsa('.item.on').forEach(x=>x.classList.remove('on')); photoSets.phReq.length = 0; initPhotos('phReq', 3);
  }
};

initPhotos('phBook', 2);
qs('#fBook').onsubmit = async e => {
  e.preventDefault();
  const c = sbCalc();
  if (!c.n || c.n < 1) { toast(tx('badDates')); return; }
  if (!photoSets.phBook.length) { toast(tx('needReceipt')); return; }
  const d = Object.fromEntries(new FormData(e.target));
  const txt = `🛏️ BOOKING REQUEST (book for guest)\nRoom: ${c.r.en}\nDates: ${c.a} → ${c.b} (${c.n} night${c.n>1?'s':''})\nGuests: ${d.guests}` + (d.time?`\nArrival time: ${d.time}`:'') +
   `\nTotal: ${money(c.r.price*c.n)} · Deposit 50%: ${money(c.r.price*c.n/2)} (receipt attached)\nName: ${d.name}\nCountry: ${d.country||'-'}\nPhone: ${d.phone}\nEmail: ${d.email||'-'}` + (d.note?`\nNote: ${d.note}`:'') + who();
  if (await send('booking', txt, photoSets.phBook, e.target.querySelector('button[type=submit]'), 'doneBook')) {
    e.target.reset(); photoSets.phBook.length = 0; initPhotos('phBook', 2);
  }
};

// Remember room number for in-house guests
try { const rm = localStorage.getItem('aj_room'); if (rm) qs('#fReq [name=room]').value = rm;
  qs('#fReq [name=room]').addEventListener('change', e => localStorage.setItem('aj_room', e.target.value)); } catch(e){}
// Deep links: ?page=request&room=203  (for QR codes in each room)
const q = new URLSearchParams(location.search);
const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || q.get('page');
if (q.get('room')) qs('#fReq [name=room]').value = q.get('room');
if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param && /^room\d+$/.test(sp)) { qs('#fReq [name=room]').value = sp.slice(4); }
const startPage = sp && /^room\d+$/.test(sp) ? 'request' : sp;

drawQR();
applyLang();
if (startPage && qs('#p-'+startPage)) go(startPage);
</script>
