<style>
:root{--bg:#e9edf1;--card:#fff;--ink:#1f2933;--mute:#66727f;--line:#d5dce3;--hd:#3d4752;--ac:#0284c7;--sky:#0ea5e9;--skybg:#e0f2fe;--ok:#1f7a3a;--okbg:#e3f4e8;--warn:#a15c07;--warnbg:#fdf2dc;--bad:#b42318;--badbg:#fde8e6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Kantumruy Pro",system-ui,sans-serif;font-size:15px;line-height:1.45}
header{background:var(--hd);color:#fff;border-bottom:3px solid var(--sky);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header .lg{width:38px;height:38px;flex:none}header b{font-size:18px;flex:1;line-height:1.2}header small{display:block;opacity:.75;font-weight:400;font-size:11px;letter-spacing:.04em}
header button.ic,#drawer .dh button{border:0;background:none;color:#fff;line-height:1;padding:6px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:6}

nav button span{display:flex;justify-content:center;margin-bottom:2px}nav button.on{color:#0369a1;font-weight:700}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:10px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-top:3px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
button.b,a.b{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
button.b.alt,a.b.alt{background:#fff;color:#0369a1;border:1px solid #b9d9ee}button.b.bad{background:var(--badbg);color:var(--bad)}button.b.sm,a.b.sm{padding:8px 12px;min-height:38px;font-size:13px}button.b.full{width:100%}button.b:disabled{opacity:.55}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.muted{color:var(--mute)}.hide{display:none!important}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:#eee;color:#555}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}
.types{display:grid;grid-template-columns:1fr;gap:10px}

.type span.ico{width:48px;height:48px;border-radius:14px;background:var(--skybg);display:flex;align-items:center;justify-content:center;color:#0369a1;flex:none}
.type small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.item{display:flex;gap:12px;width:100%;text-align:left;border:0;background:#fff;border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px #0001;font:inherit;cursor:pointer;align-items:center}
.item img{width:64px;height:46px;object-fit:cover;border-radius:8px;background:#ddd;flex:none}.item .th{width:64px;height:46px;border-radius:8px;background:var(--skybg);display:flex;align-items:center;justify-content:center;color:#0369a1;flex:none}
.item b{display:block}.item small{color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}.chips button.on{background:var(--sky);color:#fff;border-color:var(--sky)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--hd);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;max-width:88vw;text-align:center}
dialog{border:0;border-radius:18px;padding:0;max-width:460px;width:calc(100% - 24px);max-height:92vh;overflow:auto}dialog::backdrop{background:#0007}.dbody{padding:16px}
.note{background:var(--skybg);border-radius:12px;padding:10px 12px;font-size:13px;color:#0c4a6e}
#ov{position:fixed;inset:0;background:#0007;z-index:20}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:#fff;z-index:21;transform:translateX(-102%);transition:transform .2s;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);overflow:auto}#drawer.open{transform:none}
#drawer .dh{background:var(--hd);color:#fff;border-bottom:3px solid var(--sky);padding:calc(16px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:10px}#drawer .dh img{width:44px;height:44px}#drawer .dh b{flex:1;font-size:17px}
#drawer .mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:16px;padding:14px 18px;cursor:pointer;color:var(--ink)}#drawer hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.langs button{display:block;width:100%;text-align:left;font:inherit;font-size:17px;padding:13px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.langs button.on{border-color:var(--sky);background:var(--skybg);font-weight:700}
/* camera */
#cam{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column;color:#fff}
#cam .top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
#cam .top b{flex:1;font-size:14px;font-weight:600}
#cam .stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#cam video{max-width:100%;max-height:100%;display:block}
#cam canvas.ov{position:absolute;pointer-events:none}
#cam .bar{display:flex;align-items:center;justify-content:space-around;padding:14px 10px calc(18px + env(safe-area-inset-bottom))}
#cam .bar button.rb{width:48px;height:48px;border-radius:50%;border:0;background:#ffffff26;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}#cam .bar button.rb.on{background:var(--sky)}
#cam .shutter{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#ffffff40;cursor:pointer}
#cam .status{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:14px;text-shadow:0 1px 3px #000}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50;transition:opacity .25s}
/* editor */
#edw{position:relative;background:#111;border-radius:14px;overflow:hidden;touch-action:none;display:flex;justify-content:center}
#edw canvas{display:block;max-width:100%;touch-action:none}
.scanline{position:absolute;left:0;right:0;height:46px;top:-46px;background:linear-gradient(to bottom,transparent,#38bdf8aa 70%,#e0f2fe);border-bottom:2px solid #e0f2fe;animation:sweep .9s ease-in-out infinite}
@keyframes sweep{to{top:100%}}
.pg img{width:100%;border-radius:12px;background:#ddd;display:block}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:10px 0}.thumbs img{height:64px;border-radius:8px;border:3px solid transparent;cursor:pointer}.thumbs img.on{border-color:var(--sky)}
.bar2{height:6px;border-radius:3px;background:#dbe4ea;overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:var(--sky);transition:width .2s}
@media print{header,nav,main,#drawer,#ov,.toast{display:none!important}}
</style></head><body>

<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)};

var P={camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><circle cx="12" cy="10" r="2.5"/><path d="M8.5 14.5h7M20 17v4H6.5a2.5 2.5 0 0 1 0-4"/>',card:'<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="11" r="2"/><path d="M13 9h5M13 13h5M5 16c.8-1.5 2-2 3-2s2.2.5 3 2"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8M8 9h2"/>',image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',check:'<path d="M20 6 9 17l-5-5"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',lib:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>',send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>',down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',plus:'<path d="M12 5v14M5 12h14"/>',sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',text:'<path d="M4 7V4h16v3M9 20h6M12 4v16"/>',refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>'};
function ic(n,z){z=z||18;return'<svg class="i" viewBox="0 0 24 24" width="'+z+'" height="'+z+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+"</svg>"}
var T=window.AJS_T,LANGS=window.AJL_LANGS,SC=window.SC;
var K_TOK="asc_tok",K_LANG="asc_lang",K_LIB="asc_lib",mem={};
function load(k,d){try{var v=localStorage.getItem(k);if(v!=null)return JSON.parse(v)}catch(e){}return k in mem?JSON.parse(mem[k]):d}
function save(k,v){var s=JSON.stringify(v);try{localStorage.setItem(k,s);delete mem[k]}catch(e){mem[k]=s}}
var LANGSET=!!load(K_LANG,null),LANG=load(K_LANG,null)||(function(){var n=(navigator.language||"en").slice(0,2).toLowerCase();return T[n]?n:"en"})();
function t(k,v){var s=(T[LANG]||{})[k];if(s==null)s=T.en[k];if(s==null)s=k;if(v)for(var x in v)s=s.split("{"+x+"}").join(v[x]);return s}
function toast(m){var e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},2800)}
function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
var TOK=load(K_TOK,"")||"",ME=null,AUTH="boot",NEEDSETUP=false,NOBACK=false,RET=0,LIB=load(K_LIB,[]),SINCE=0,tab="home",libQ="",libF="all",PENDING=[];
var TYPES={passport:{ic:"book",ratio:125/88},idcard:{ic:"card",ratio:85.6/54},document:{ic:"file",ratio:null}};

/* ---------- api ---------- */
function api(method,path,body){var h={"content-type":"application/json"};if(TOK)h.authorization="Bearer "+TOK;
 return fetch("/api/"+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){return r.text().then(function(tx){var j;try{j=JSON.parse(tx)}catch(e){throw{code:"nojson",status:r.status}}if(!r.ok)throw{code:j.error||"err",status:r.status,j:j};return j})})}
function sessionEnd(){TOK="";save(K_TOK,"");toast(t("sess_expired"));setTimeout(function(){location.reload()},900)}

/* ---------- IndexedDB (pending uploads) ---------- */
function idb(){return new Promise(function(res,rej){var r=indexedDB.open("soramma-scan",1);r.onupgradeneeded=function(){r.result.createObjectStore("pending",{keyPath:"id"})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function idbDo(mode,fn){return idb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction("pending",mode),st=tx.objectStore("pending"),rq=fn(st);tx.oncomplete=function(){res(rq&&rq.result)};tx.onerror=function(){rej(tx.error)}})})}
function pendList(){return idbDo("readonly",function(s){return s.getAll()}).then(function(a){PENDING=a||[];return PENDING}).catch(function(){PENDING=[];return[]})}
function flushPending(){if(!TOK||NOBACK)return Promise.resolve();return pendList().then(function(L){var n=0;return L.reduce(function(p,sc){return p.then(function(){return api("POST","scans",sc).then(function(){n++;return idbDo("readwrite",function(s){return s.delete(sc.id)})}).catch(function(e){if(e&&e.code==="auth")sessionEnd()})})},Promise.resolve()).then(function(){if(n){toast(t("uploaded_n",{n:n}));return syncLib()}})}).then(function(){return pendList()})}

/* ---------- library sync ---------- */
function syncLib(){if(!TOK||NOBACK)return Promise.resolve();return api("GET","scans?since="+Math.max(0,SINCE-3000)).then(function(r){SINCE=r.now;RET=r.retention||0;
  r.scans.forEach(function(x){var i=LIB.findIndex(function(y){return y.id===x.id});if(x.del){if(i>=0)LIB.splice(i,1)}else if(i>=0)LIB[i]=x;else LIB.push(x)});save(K_LIB,LIB);if(!$("cam").classList.contains("hide"))return;if(tab==="lib"||tab==="home")render()}).catch(function(e){if(e&&e.code==="auth")sessionEnd()})}

/* ---------- shell ---------- */
function nav(){var tt=[["home","scan","nav_scan"],["lib","lib","nav_library"]];
 $("nav").innerHTML=tt.map(function(x){return'<button class="'+(tab===x[0]?"on":"")+'" data-t="'+x[0]+'"><span>'+ic(x[1],24)+"</span>"+esc(t(x[2]))+"</button>"}).join("")+'<button data-t="__menu"><span>'+ic("menu",24)+"</span>"+esc(t("nav_menu"))+"</button>";
 $("nav").onclick=function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.t==="__menu"){openDrawer();return}tab=b.dataset.t;render()}}
function openDrawer(){var d=$("drawer");
 d.innerHTML='<div class="dh"><img src="logo-for-dark.svg" alt=""><b>Soramma Scan<small style="display:block;font-weight:400;opacity:.75;font-size:12px">by Soramma</small></b><button id="dx" aria-label="close">'+ic("x",22)+'</button></div>'+
 '<button class="mi" data-t="__lang">'+ic("globe",20)+esc(t("language"))+" · "+esc((LANGS.filter(function(l){return l[0]===LANG})[0]||["","English"])[1])+"</button>"+
 (ME&&ME.role==="owner"?'<button class="mi" data-t="__set">'+ic("sliders",20)+esc(t("settings"))+"</button>":"")+
 (ME?'<hr><div style="padding:6px 18px"><b>'+esc(t("signed_as",{n:ME.name}))+'</b></div><button class="mi" data-t="__logout">'+ic("lock",20)+esc(t("logout"))+"</button>":"")+
 '<div class="muted" style="font-size:12px;padding:12px 18px">'+esc(t("privacy_note"))+"</div>";
 d.onclick=function(e){var b=e.target.closest("button");if(!b)return;if(b.id==="dx"){closeDrawer();return}var k=b.dataset.t;if(!k)return;closeDrawer();
  if(k==="__lang")langDialog(false);else if(k==="__set")settingsDialog();else if(k==="__logout"){if(confirm(t("logout")+"?"))api("POST","logout").catch(function(){}).then(function(){TOK="";save(K_TOK,"");location.reload()})}};

function langDialog(first){$("dbody").innerHTML='<h2>'+ic("globe")+" "+(first?"Language · ភាសា · 语言 · Langue · Язык · 언어":esc(t("choose_language")))+'</h2><div class="langs">'+LANGS.map(function(l){return'<button data-l="'+l[0]+'" class="'+(l[0]===LANG&&!first?"on":"")+'">'+esc(l[1])+"</button>"}).join("")+"</div>"+(first?"":'<div class="row"><span class="sp"></span><button class="b alt sm" id="lc">'+esc(t("close"))+"</button></div>");

 if(!$("dlg").open)$("dlg").showModal();$("dbody").onclick=null;$("dlg").oncancel=null;$("s_x").onclick=function(){$("dlg").close()};

/* ---------- login ---------- */
function vLogin(){return'<div class="card"><div style="text-align:center"><img src="logo-for-light.svg" alt="" style="width:64px;height:64px"></div><h2 style="text-align:center">'+esc(t(NEEDSETUP?"setup_title":"login_title"))+"</h2>"+
 (NOBACK?'<p class="note">'+esc(t("no_backend"))+"</p>":
 (NEEDSETUP?'<label>'+esc(t("f_biz"))+'<input id="a_biz" value="Soramma"></label>':"")+'<label>'+esc(t(NEEDSETUP?"f_owner":"f_user"))+'<input id="a_name" autocomplete="username" autocapitalize="off"></label><label>'+esc(t(NEEDSETUP?"f_pass":"f_code"))+'<input id="a_code" type="password" autocomplete="current-password"></label><div id="a_err" style="color:var(--bad);min-height:22px"></div><button class="b full" id="a_go">'+esc(t(NEEDSETUP?"btn_setup":"btn_login"))+"</button>")+"</div>"}
function bindLogin(){if(NOBACK)return;var go=function(){var n=$("a_name").value.trim(),c=$("a_code").value;if(!n||!c)return;if(NEEDSETUP&&c.length<6){$("a_err").textContent=t("pass_short");return}
  $("a_go").disabled=true;$("a_err").textContent="";

 try{navigator.clipboard.writeText(txt);toast(t("copied"))}catch(e){var a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(x){}a.remove();toast(t("copied"))}}

/* ---------- OCR ---------- */
var workers={},onProg=null;
function loadTess(){return new Promise(function(res,rej){if(window.Tesseract)return res();var s=document.createElement("script");s.src="ocr/tesseract.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function getWorker(lang){if(workers[lang])return workers[lang];var base=new URL("ocr",location.href).href;
 workers[lang]=loadTess().then(function(){return Tesseract.createWorker(lang,1,{workerPath:base+"/worker.min.js",corePath:base,langPath:base,logger:function(m){if(onProg&&m.progress!=null)onProg(m)}})});workers[lang].catch(function(){delete workers[lang]});return workers[lang]}
function prog(on,txt,p){$("r_prog").classList.toggle("hide",!on);if(txt!=null)$("r_pt").textContent=txt;if(p!=null)$("r_bar").style.width=Math.round(p*100)+"%"}
function msg(txt,ok){var m=$("r_msg");if(!txt){m.classList.add("hide");return}m.classList.remove("hide");m.textContent=txt}
function regionCanvas(page,y0,width){var full=pageCanvas(page,"color"),y=Math.round(full.height*y0),h=full.height-y,c=document.createElement("canvas"),w=width||1600;c.width=w;c.height=Math.max(20,Math.round(h*w/full.width));var x=c.getContext("2d");x.drawImage(full,0,y,full.width,h,0,0,c.width,c.height);var id=x.getImageData(0,0,c.width,c.height),o=SC.grayscaleBoost(id.data,c.width,c.height);id.data.set(o);x.putImageData(id,0,0);return c}
function runMrz(){msg("");prog(true,t("reading"),.02);$("r_read").disabled=true;onProg=function(m){prog(true,t("reading"),m.progress)};var best=null;
 getWorker("eng").then(function(w){return w.setParameters({tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<",tessedit_pageseg_mode:"6"}).then(function(){var regions=D.type==="passport"?[.66,.72]:[.5,.62,.7],seq=[];
  D.pages.forEach(function(pg){regions.forEach(function(y){seq.push([pg,y])})});
  return seq.reduce(function(p,it){return p.then(function(){if(best&&SC.mrzValid(best))return;return w.recognize(regionCanvas(it[0],it[1])).then(function(r){var m=SC.mrzParse(r.data.text);if(m&&(!best||(m.ok.docno+m.ok.dob+m.ok.exp+m.ok.final)>(best.ok.docno+best.ok.dob+best.ok.exp+best.ok.final)))best=m})})},Promise.resolve())})}).then(function(){
  prog(false);$("r_read").disabled=false;
  if(best){var f=D.fields;f.surname=best.surname;f.given=best.given;f.docno=best.docno;f.nationality=best.nationality||best.issuer;f.dob=best.dob;f.expiry=best.expiry;f.sex=best.sex;f.personal=best.personal;f._ok=Object.keys(best.ok).filter(function(k){return best.ok[k]}).join(",");
   $("r_form").innerHTML=fieldsForm(D.type,f);msg(t("read_ok"))}else msg(t("read_fail"))}).catch(function(){prog(false);$("r_read").disabled=false;msg(t("read_fail"))})}
function runText(){msg("");prog(true,t("reading"),.02);$("r_text").disabled=true;onProg=function(m){prog(true,t("reading"),m.progress)};var txt=[];
 getWorker("eng+khm").then(function(w){return w.setParameters({tessedit_char_whitelist:"",tessedit_pageseg_mode:"3"}).then(function(){return D.pages.reduce(function(p,pg){return p.then(function(){var c=pageCanvas(pg,"color");return w.recognize(c).then(function(r){txt.push(r.data.text)})})},Promise.resolve())})}).then(function(){prog(false);$("r_text").disabled=false;D.text=txt.join("\n").replace(/[ \t]+\n/g,"\n").trim().slice(0,20000);$("f_text").value=D.text;msg(t("read_ok"))}).catch(function(){prog(false);$("r_text").disabled=false;msg(t("read_fail"))})}

/* ---------- save / export ---------- */
function thumbOf(url){return new Promise(function(res){var im=new Image();im.onload=function(){var s=200/im.width,c=document.createElement("canvas");c.width=200;c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.6))};im.onerror=function(){res("")};im.src=url})}
function cleanFields(f){var o={};Object.keys(f).forEach(function(k){if(k==="_ok")o.mrz_ok=f[k];else if(f[k])o[k]=f[k]});return o}
function saveScan(){if(!D.pages.length)return;var pages=D.pages.map(function(p){return pageUrl(p,.85)}),fields=cleanFields(D.fields),btn=$("r_save");btn.disabled=true;btn.textContent=t("uploading");
 thumbOf(pages[0]).then(function(th){var sc={id:D.id,type:D.type,fields:fields,text:D.text||"",created:D.created,pages:pages,thumb:th};
  return api("POST","scans",sc).then(function(){toast(t("saved"));finish()}).catch(function(e){if(e&&e.code==="auth"){sessionEnd();return}
   return idbDo("readwrite",function(s){return s.put(sc)}).then(function(){toast(t("saved_pending"));finish()})});
  function finish(){D=null;tab="lib";SINCE=0;syncLib().then(function(){pendList().then(render)})}})}
function dataUrlBytes(u){var b=atob(u.split(",")[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function imgSize(u){return new Promise(function(res){var im=new Image();im.onload=function(){res([im.naturalWidth,im.naturalHeight])};im.src=u})}
function fileBase(type,f){var n=[f&&f.surname,f&&f.given].filter(Boolean).join("_")||type;return(n+"_"+new Date().toISOString().slice(0,10)).replace(/[^\w\-]+/g,"_")}
function exportPdf(urls,type,f,share){Promise.all(urls.map(imgSize)).then(function(sz){var pages=urls.map(function(u,i){return{jpeg:dataUrlBytes(u),w:sz[i][0],h:sz[i][1],full:type==="document"}}),pdf=SC.makePdf(pages,fileBase(type,f)),name=fileBase(type,f)+".pdf",blob=new Blob([pdf],{type:"application/pdf"});
  if(share&&navigator.canShare){var file=new File([blob],name,{type:"application/pdf"});if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(){});return}}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)})}

   '<div class="row"><button class="b sm" id="d_save">'+ic("check",16)+esc(t("save"))+'</button><button class="b alt sm" id="d_pdf">'+ic("file",16)+esc(t("export_pdf"))+'</button><button class="b alt sm" id="d_share">'+ic("send",16)+esc(t("share"))+'</button><button class="b alt sm" id="d_copy">'+ic("copy",16)+esc(t("copy_data"))+'</button><button class="b bad sm" id="d_del">'+ic("trash",16)+'</button><span class="sp"></span><button class="b alt sm" id="d_x">'+esc(t("close"))+"</button></div>";
  if($("f_text"))$("f_text").value=s.text||"";var cur=function(){var f2=JSON.parse(JSON.stringify(f));readFields($("d_form"),f2);return f2};

  $("d_pdf").onclick=function(){exportPdf(r.pages,s.type,cur())};$("d_share").onclick=function(){exportPdf(r.pages,s.type,cur(),true)};$("d_copy").onclick=function(){copyData(cur())};
  $("d_del").onclick=function(){if(!confirm(t("delete_q")))return;api("DELETE","scans/"+encodeURIComponent(s.id)).then(function(){$("dlg").close();SINCE=0;LIB=LIB.filter(function(x){return x.id!==s.id});save(K_LIB,LIB);render()}).catch(function(){toast(t("net_err"))})}}).catch(function(){$("dbody").innerHTML='<p>'+esc(t("net_err"))+'</p><button class="b alt sm" onclick="document.getElementById(\'dlg\').close()">'+esc(t("close"))+"</button>"})}
