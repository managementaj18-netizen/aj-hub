function bindMain(){var a=$("app");
 a.onclick=function(e){var b=e.target.closest("button");if(!b)return;
  if(b.id==="b_share")return consent();if(b.id==="b_stop")return setSharing(false);if(b.id==="m_fit"){fitted=false;return drawMap()}
  if(b.dataset.focus){TAB="map";render();var m=D.members.filter(function(x){return x.id===b.dataset.focus})[0];if(m&&map&&m.lat!=null)map.setView([m.lat,m.lng],17,{animate:false});return}
  if(b.id==="c_copy"){return copy(D.family.code)}if(b.id==="c_share"){var tx=t("invite_text",{u:location.origin,c:D.family.code});if(navigator.share)navigator.share({text:tx}).catch(function(){});else copy(tx);return}
  if(b.dataset.rm){if(confirm(t("remove_q")))api("DELETE","members/"+b.dataset.rm).then(sync);return}
  if(b.id==="o_lang"){LANG=LANG==="km"?"en":"km";sv("fam_lang",LANG);return render()}
  if(b.id==="o_out"){api("POST","logout").catch(function(){}).then(function(){reset()});return}
  if(b.id==="o_leave"){if(confirm(t("leave_q")))api("DELETE","members").catch(function(){}).then(function(){reset()})}};
 var k=$("k_on");if(k)k.onchange=function(){sv("fam_wake",k.checked);keepAwake()}}
function copy(tx){if(navigator.clipboard)navigator.clipboard.writeText(tx).then(function(){toast(t("copied"))},function(){toast(tx)});else toast(tx)}
$("hl").onclick=function(){LANG=LANG==="km"?"en":"km";sv("fam_lang",LANG);render()};
/* ---------- map ---------- */
function drawMap(){var el=$("map");if(!el)return;
 if(typeof L==="undefined"){el.innerHTML='<p class="muted" style="padding:20px;text-align:center">'+esc(t("people"))+' →</p>';return}
 if(map){map.remove();map=null;markers={}}
 map=L.map(el,{zoomControl:true,attributionControl:true,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false}).setView([11.55,104.9],6,{animate:false});
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
 var pts=[];D.members.forEach(function(m){if(m.sharing&&m.lat!=null){pts.push([m.lat,m.lng]);
   markers[m.id]=L.marker([m.lat,m.lng],{icon:L.divIcon({className:"",html:'<div style="position:relative"><div class="pin">'+esc((m.name||"?").trim().charAt(0).toUpperCase())+'</div><div class="pinl">'+esc(m.name)+'</div></div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(map)}});
 if(pts.length===1)map.setView(pts[0],16,{animate:false});else if(pts.length>1)map.fitBounds(pts,{padding:[40,40],maxZoom:17,animate:false})}
/* ---------- sharing ---------- */
function consent(){$("dbody").innerHTML='<h2>📍 '+esc(t("consent_t"))+'</h2><p>'+esc(t("consent_m"))+'</p><div class="row" style="margin-top:12px"><span class="sp"></span><button class="b alt" id="c_no">'+esc(t("cancel"))+'</button><button class="b" id="c_yes">'+esc(t("agree"))+'</button></div>';
 if(!$("dlg").open)$("dlg").showModal();$("c_no").onclick=function(){$("dlg").close()};$("c_yes").onclick=function(){$("dlg").close();setSharing(true)}}
function setSharing(on){if(on&&!navigator.geolocation){toast(t("loc_denied"));return}
 api("POST","sharing",{on:on}).then(function(){return sync()}).catch(function(){toast(t("e_net"))})}
function dist(a,b,c,d){var R=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function startWatch(){if(watchId!=null||!navigator.geolocation)return;
 watchId=navigator.geolocation.watchPosition(function(p){var n=Date.now(),c=p.coords;
  if(n-lastSent.t<20000&&dist(lastSent.lat,lastSent.lng,c.latitude,c.longitude)<30)return;
  lastSent={t:n,lat:c.latitude,lng:c.longitude};api("POST","loc",{lat:c.latitude,lng:c.longitude,acc:c.accuracy}).catch(function(){})},
  function(e){if(e&&e.code===1){toast(t("loc_denied"));setSharing(false)}},{enableHighAccuracy:true,maximumAge:10000,timeout:30000});keepAwake()}
function stopWatch(){if(watchId!=null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);watchId=null;if(wake){try{wake.release()}catch(e){}wake=null}}
function keepAwake(){if(wake){try{wake.release()}catch(e){}wake=null}if(D&&D.me.sharing&&ld("fam_wake",false)&&navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){wake=w}).catch(function(){})}
/* ---------- sync ---------- */
function sync(){return api("GET","sync").then(function(r){var first=!D,was=D&&D.me.sharing;D=r;if(r.me.sharing&&watchId==null)startWatch();if(!r.me.sharing)stopWatch();if(first||!$("dlg").open){var y=window.scrollY;if(TAB==="map"&&map&&!first&&was===r.me.sharing){updateMarkers()}else render();window.scrollTo(0,y)}return r}).catch(function(e){if(e&&e.code==="auth")reset();else if(!D)render()})}
function updateMarkers(){D.members.forEach(function(m){var mk=markers[m.id];if(m.sharing&&m.lat!=null){if(mk)mk.setLatLng([m.lat,m.lng]);else drawMap()}else if(mk){drawMap()}})}
function reset(){TOK="";sv("fam_tok","");D=null;stopWatch();clearInterval(pollT);pollT=null;AUTHMODE="login";render()}
function start(){TAB="map";sync().then(function(){render();if(!pollT)pollT=setInterval(function(){if(!document.hidden&&TOK)sync()},15000)})}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&TOK){sync();keepAwake()}});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});
render();if(TOK)start();
</script></body></html>
