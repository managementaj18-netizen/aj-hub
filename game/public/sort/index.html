<!doctype html>
<html lang="km"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b2a6b">
<title>ទឹកផ្លែឈើ · Juice Sort</title>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1b4d;color:#fff;font-family:"Kantumruy Pro",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#4b46b8,#2b2a6b 55%,#1d1b4d)}
#top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 6px}
#top .t{flex:1;text-align:center;font-weight:700;font-size:20px;line-height:1.1}#top .t small{display:block;font-weight:400;font-size:12px;opacity:.8}
.ib{border:0;background:#ffffff22;color:#fff;border-radius:14px;width:42px;height:42px;font-size:19px;cursor:pointer}.ib:disabled{opacity:.35}
canvas{flex:1;width:100%;display:block;min-height:0}
#bar{display:flex;gap:10px;justify-content:center;padding:6px 12px calc(14px + env(safe-area-inset-bottom))}
.act{border:0;background:#ffffff26;color:#fff;border-radius:16px;padding:10px 14px;font:700 15px "Kantumruy Pro",system-ui,sans-serif;cursor:pointer;min-width:84px}
.act:disabled{opacity:.35}.act small{display:block;font-weight:400;font-size:11px;opacity:.85}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#12103acc;text-align:center;padding:24px}.ov.hide{display:none}
.ov h1{font-size:32px;margin:0}.ov p{margin:0;max-width:330px;font-size:16px}
.big{background:#ffb703;color:#3d2a00;border:0;border-radius:18px;padding:14px 34px;font:700 22px "Kantumruy Pro",system-ui,sans-serif;cursor:pointer;box-shadow:0 5px 0 #c98a00}.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c98a00}
.sm{background:#ffffff33;color:#fff;border:0;border-radius:99px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer}
.stars{font-size:40px;letter-spacing:6px}
</style></head><body>
<div id="wrap">
<div id="top"><button class="ib" id="bh" aria-label="menu">☰</button><div class="t"><span id="tLv"></span><small id="tMv"></small></div><button class="ib" id="bs">🔊</button></div>
<canvas id="c"></canvas>
<div id="bar"><button class="act" id="undo"></button><button class="act" id="restart"></button><button class="act" id="addt"></button></div>
<div class="ov hide" id="ovWin"><div class="stars" id="stars"></div><h1 id="tWin"></h1><p id="tWinSub"></p><button class="big" id="next"></button></div>
<div class="ov hide" id="ovMenu"><div style="font-size:60px">🥭🍉🍋</div><h1 id="mTitle"></h1><p id="mHow"></p><button class="big" id="resume"></button><button class="sm" id="lang"></button><button class="sm" id="reset"></button><a class="sm" href="../" style="text-decoration:none" id="more">🧺 ចាប់ផ្លែឈើ</a></div>
</div>
<script>
/* ===== game logic (pure) ===== */
var CAP=4;
var FRUIT=[["🥭","#f4b400"],["🍉","#e53950"],["🍏","#6ccf3a"],["🍇","#8b4fd1"],["🫐","#2f6fe0"],["🍊","#ff7a1a"],["🥥","#f3ead8"],["🐉","#ff5fa8"],["🍋","#e9f03a"],["🍆","#4b2e83"]];
function clone(t){return t.map(function(x){return x.slice()})}
function topc(tube){return tube.length?tube[tube.length-1]:-1}
function runLen(tube){var c=topc(tube),n=0;for(var i=tube.length-1;i>=0&&tube[i]===c;i--)n++;return n}
function canPour(a,b){if(!a.length||b.length>=CAP)return false;if(!b.length)return true;return topc(a)===topc(b)}
function pour(a,b){var n=Math.min(runLen(a),CAP-b.length),c=topc(a);for(var i=0;i<n;i++){a.pop();b.push(c)}return n}
function solved(tubes){return tubes.every(function(t){return t.length===0||(t.length===CAP&&t.every(function(x){return x===t[0]}))})}
function key(tubes){return tubes.map(function(t){return t.join("")}).sort().join("|")}
/* depth-first solver with a step cap; returns true if solvable */
function solvable(tubes,cap){var seen={},steps=0;
 function go(s){if(solved(s))return true;if(++steps>cap)return false;var k=key(s);if(seen[k])return false;seen[k]=1;
  for(var i=0;i<s.length;i++){if(!s[i].length)continue;if(s[i].length===CAP&&s[i].every(function(x){return x===s[i][0]}))continue;
   for(var j=0;j<s.length;j++){if(i===j||!canPour(s[i],s[j]))continue;if(!s[j].length&&runLen(s[i])===s[i].length)continue;
    var n=clone(s);pour(n[i],n[j]);if(go(n))return true}}return false}
 return go(clone(tubes))}
function levelColors(lv){return Math.min(3+Math.floor((lv-1)/2),10)}
function rngSeed(s){return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function makeLevel(lv){var nc=levelColors(lv),r=rngSeed(lv*7919+13);
 for(var tries=0;tries<200;tries++){var pool=[];for(var c=0;c<nc;c++)for(var k=0;k<CAP;k++)pool.push(c);
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),x=pool[i];pool[i]=pool[j];pool[j]=x}
  var tubes=[];for(var t=0;t<nc;t++)tubes.push(pool.slice(t*CAP,t*CAP+CAP));tubes.push([]);tubes.push([]);
  if(solved(tubes))continue;if(solvable(tubes,20000))return tubes}
 return tubes}
/* ===== state ===== */
var TX={km:{title:"ទឹកផ្លែឈើ",lv:"កម្រិត {n}",mv:"ដំណើរ {n}",how:"ចុចដបមួយ ហើយចុចដបមួយទៀត ដើម្បីចាក់ទឹកពណ៌។ ចាក់បានតែពណ៌ដូចគ្នា ឬចូលដបទទេ។ ធ្វើឲ្យដបនីមួយៗមានតែពណ៌តែមួយ!",undo:"ត្រឡប់",restart:"ចាប់ផ្តើមឡើងវិញ",add:"បន្ថែមដប",win:"ពូកែណាស់!",winsub:"ចប់កម្រិត {n} ក្នុង {m} ដំណើរ",next:"កម្រិតបន្ទាប់",resume:"លេងបន្ត",reset:"លុបកំណត់ត្រា",reset_q:"ត្រឡប់ទៅកម្រិត 1?"},
 en:{title:"Juice Sort",lv:"Level {n}",mv:"{n} moves",how:"Tap a bottle, then tap another to pour. You can pour onto the same colour or into an empty bottle. Make every bottle one colour!",undo:"Undo",restart:"Restart",add:"Add bottle",win:"Well done!",winsub:"Level {n} done in {m} moves",next:"Next level",resume:"Continue",reset:"Reset progress",reset_q:"Go back to level 1?"}};
function ld(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var LANG=ld("js_lang",(navigator.language||"").toLowerCase().indexOf("km")===0?"km":"en"),SND=ld("js_snd",true),$=function(i){return document.getElementById(i)};
function t(k,v){var s=TX[LANG][k]||TX.en[k]||k;if(v)for(var x in v)s=s.split("{"+x+"}").join(v[x]);return s}
var S={lv:ld("js_lv",1),tubes:[],hist:[],sel:-1,moves:0,extra:false,won:false,anim:null};
function newLevel(lv){S.lv=lv;sv("js_lv",lv);S.tubes=makeLevel(lv);S.hist=[];S.sel=-1;S.moves=0;S.extra=false;S.won=false;S.anim=null;texts();$("ovWin").classList.add("hide")}
function texts(){document.documentElement.lang=LANG;$("tLv").textContent=t("lv",{n:S.lv});$("tMv").textContent=t("mv",{n:S.moves});$("undo").innerHTML="↩️<small>"+t("undo")+"</small>";$("restart").innerHTML="🔄<small>"+t("restart")+"</small>";$("addt").innerHTML="➕<small>"+t("add")+"</small>";
 $("undo").disabled=!S.hist.length||S.won;$("addt").disabled=S.extra||S.won;$("bs").textContent=SND?"🔊":"🔇";$("mTitle").textContent=t("title");$("mHow").textContent=t("how");$("resume").textContent=t("resume");$("lang").textContent=LANG==="km"?"English":"ខ្មែរ";$("reset").textContent=t("reset");$("tWin").textContent=t("win");$("next").textContent=t("next")}
function beep(f,d){if(!SND)return;try{var a=beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)()),o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.1,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function tap(i){if(S.won||i<0||i>=S.tubes.length)return;
 if(S.sel<0){if(S.tubes[i].length){S.sel=i;beep(500,.06)}return}
 if(S.sel===i){S.sel=-1;return}
 var a=S.tubes[S.sel],b=S.tubes[i];
 if(canPour(a,b)){S.hist.push(clone(S.tubes));var from=S.sel,col=topc(a);pour(a,b);S.moves++;S.sel=-1;S.anim={from:from,to:i,col:col,t:0};beep(300+col*40,.12);
  if(solved(S.tubes)){S.won=true;var par=levelColors(S.lv)*2,st=S.moves<=par+2?3:S.moves<=par*2?2:1;$("stars").textContent="⭐".repeat(st)+"☆".repeat(3-st);$("tWinSub").textContent=t("winsub",{n:S.lv,m:S.moves});setTimeout(function(){$("ovWin").classList.remove("hide");beep(784,.25)},450)}}
 else{S.sel=b.length?i:-1;beep(180,.08)}
 texts()}
function undo(){if(!S.hist.length||S.won)return;S.tubes=S.hist.pop();S.moves=Math.max(0,S.moves-1);S.sel=-1;texts()}
function addTube(){if(S.extra||S.won)return;S.tubes.push([]);S.extra=true;S.sel=-1;texts()}
/* ===== drawing ===== */
var cv=$("c"),cx=cv.getContext("2d"),W=0,H=0,DPR=1,LAY=[];
function fit(){DPR=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
window.addEventListener("resize",fit);
function layout(){var n=S.tubes.length,cols=n<=6?n:Math.ceil(n/2),rows=n<=6?1:2;var gap=10,tw=Math.min(84,(W-24-gap*(cols-1))/cols),th=Math.min(tw*3.3,(H-30-gap*2*(rows-1))/rows-24);th=Math.max(th,tw*2);
 var totalW=cols*tw+(cols-1)*gap,x0=(W-totalW)/2,totalH=rows*(th+36)+(rows-1)*gap,y0=Math.max(18,(H-totalH)/2);LAY=[];
 for(var i=0;i<n;i++){var r=n<=6?0:(i<cols?0:1),c=n<=6?i:(i<cols?i:i-cols);LAY.push({x:x0+c*(tw+gap),y:y0+r*(th+36+gap)+(S.sel===i?0:14),w:tw,h:th})}}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function draw(){cx.clearRect(0,0,W,H);layout();
 for(var i=0;i<S.tubes.length;i++){var L=LAY[i],tube=S.tubes[i],lh=(L.h-14)/CAP;
  cx.save();cx.globalAlpha=.25;cx.fillStyle="#000";rr(L.x+3,L.y+6,L.w,L.h,L.w/2.2);cx.fill();cx.restore();
  cx.save();rr(L.x,L.y,L.w,L.h,L.w/2.2);cx.clip();
  cx.fillStyle="#ffffff14";cx.fillRect(L.x,L.y,L.w,L.h);
  for(var k=0;k<tube.length;k++){var col=FRUIT[tube[k]],y=L.y+L.h-7-(k+1)*lh,g=cx.createLinearGradient(L.x,0,L.x+L.w,0);g.addColorStop(0,col[1]);g.addColorStop(.45,col[1]);g.addColorStop(1,"#00000040");
   cx.fillStyle=g;cx.fillRect(L.x+2,y,L.w-4,lh+.5);cx.globalAlpha=.9;cx.font=Math.min(lh*.62,26)+"px serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(col[0],L.x+L.w/2,y+lh/2+1);cx.globalAlpha=1;
   if(k===tube.length-1||tube[k+1]!==tube[k]){cx.fillStyle="#ffffff40";cx.fillRect(L.x+2,y,L.w-4,2)}}
  cx.restore();
  cx.lineWidth=3;cx.strokeStyle=S.sel===i?"#ffd166":"#ffffffaa";rr(L.x,L.y,L.w,L.h,L.w/2.2);cx.stroke();
  cx.fillStyle="#ffffff2a";rr(L.x+5,L.y+8,5,L.h-24,3);cx.fill();
  if(S.sel===i){cx.fillStyle="#ffd166";cx.font="18px serif";cx.textAlign="center";cx.fillText("▼",L.x+L.w/2,L.y-8)}}}
function frame(){draw();requestAnimationFrame(frame)}
cv.addEventListener("pointerdown",function(e){var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;layout();for(var i=0;i<LAY.length;i++){var L=LAY[i];if(x>=L.x-6&&x<=L.x+L.w+6&&y>=L.y-24&&y<=L.y+L.h+10){tap(i);return}}S.sel=-1});
$("undo").onclick=undo;$("restart").onclick=function(){newLevel(S.lv)};$("addt").onclick=addTube;$("next").onclick=function(){newLevel(S.lv+1)};
$("bh").onclick=function(){$("ovMenu").classList.remove("hide")};$("resume").onclick=function(){$("ovMenu").classList.add("hide")};
$("bs").onclick=function(){SND=!SND;sv("js_snd",SND);texts()};$("lang").onclick=function(){LANG=LANG==="km"?"en":"km";sv("js_lang",LANG);texts()};
$("reset").onclick=function(){if(confirm(t("reset_q"))){newLevel(1);$("ovMenu").classList.add("hide")}};
window.JS={S:S,tap:tap,undo:undo,canPour:canPour,pour:pour,solved:solved,solvable:solvable,makeLevel:makeLevel,newLevel:newLevel,CAP:CAP,levelColors:levelColors,addTube:addTube,fit:fit};
fit();newLevel(S.lv);requestAnimationFrame(frame);
</script></body></html>
