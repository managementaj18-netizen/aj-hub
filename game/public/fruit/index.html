/* iPhone/Safari keep sound off until the first touch: create and resume the audio engine inside that touch */
function unlockAudio(){try{var a=ctx();if(!a)return;if(a.state==="suspended")a.resume();var b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}catch(e){}}

function ctx(){var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;var a=beep.a||(beep.a=new A());if(!beep.m){var c=a.createDynamicsCompressor(),m=a.createGain(),f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=5200;m.gain.value=.55;m.connect(f);f.connect(c);c.connect(a.destination);beep.m=m}return a}
/* one soft note: smooth attack + release (no clicks), sine body + quiet octave for sparkle */
function note(f,t0,d,v,ty){var a=ctx();if(!a)return;var T=a.currentTime+t0;[[1,1,ty||"sine"],[2,.18,"sine"]].forEach(function(p){var o=a.createOscillator(),g=a.createGain();o.type=p[2];o.frequency.value=f*p[0];g.gain.setValueAtTime(.0001,T);g.gain.linearRampToValueAtTime((v||.3)*p[1],T+.012);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(beep.m);o.start(T);o.stop(T+d+.03)})}
function sfx(k){if(!SND)return;try{var a=ctx();if(!a)return;if(a.state==="suspended")a.resume();
 if(k==="ok"){note(784,0,.16,.32);note(1047,.07,.22,.3)}
 else if(k==="gold"){[784,988,1175,1568].forEach(function(f,i){note(f,i*.065,.3,.3)})}
 else if(k==="level"){[523,659,784,1047].forEach(function(f,i){note(f,i*.09,.34,.3)})}
 else if(k==="bad"){note(330,0,.22,.3,"triangle");note(247,.12,.34,.3,"triangle")}
 else if(k==="over"){[392,349,311,262].forEach(function(f,i){note(f,i*.2,.45,.3,"triangle")})}
 else note(660,0,.12,.25)}catch(e){}}

var MU={step:0,next:0,id:null},HOOK=[72,76,79,0,76,72,74,0,77,74,79,0,76,74,72,0],BASS=[36,36,43,43,41,41,43,43];
function mf(n){return 440*Math.pow(2,(n-69)/12)}
function mnote(f,T,d,v,ty){var a=ctx();var o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,T);g.gain.linearRampToValueAtTime(v,T+.01);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(beep.m);o.start(T);o.stop(T+d+.03)}
function bpm(){return Math.min(172,100+12*(G.level-1))}
function mtick(){if(!MUS||!SND||G.state!=="play"||document.hidden){return}
 var a=ctx();if(!a)return;if(a.state==="suspended")a.resume();
 if(MU.next<a.currentTime-.2)MU.next=a.currentTime+.05;
 while(MU.next<a.currentTime+.3){var sd=60/bpm()/2,i=MU.step%16,n=HOOK[i];
  if(n)mnote(mf(n),MU.next,sd*1.6,.07,"triangle");
  if(i%2===0)mnote(mf(BASS[(i/2)%8]),MU.next,sd*1.8,.1,"sine");
  if(i%4===0)mnote(mf(40),MU.next,.1,.16,"sine");
  MU.next+=sd;MU.step++}}
function mstart(){if(!MU.id){MU.step=0;MU.next=0;MU.id=setInterval(mtick,80)}}
function mstop(){clearInterval(MU.id);MU.id=null}
