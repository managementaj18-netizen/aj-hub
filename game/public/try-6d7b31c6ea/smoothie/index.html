<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f6d9bf;color:#4a2840;font-family:"Kantumruy Pro","Baloo 2",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(#fdeedd,#f8d9c2)}
#top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 4px}
.pill{background:#fffaf0;border:2px solid #e9c9a8;border-radius:14px;padding:3px 12px;line-height:1.1;box-shadow:0 3px 0 #e9c9a8}
.pill small{display:block;font-size:10px;opacity:.65;font-weight:700;letter-spacing:.5px;text-transform:uppercase}.pill b{font-size:20px;font-weight:800}
.sp{flex:1}.hearts{display:flex;gap:3px;align-items:center}.hearts i{width:22px;height:22px;background:var(--h) center/contain no-repeat}
.ib{border:2px solid #e9c9a8;background:#fffaf0;color:#4a2840;border-radius:14px;width:40px;height:40px;font-size:17px;cursor:pointer;box-shadow:0 3px 0 #e9c9a8}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 6px calc(6px + env(safe-area-inset-bottom))}
#cv{display:block;border-radius:20px;box-shadow:0 8px 22px #7a3a2a33}
/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center;

.ov.hide{display:none}
.tt{font-family:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;font-weight:800;line-height:.9;transform:rotate(-3deg);display:flex;flex-direction:column;align-items:center}
.wd{position:relative;display:block;font-size:68px;letter-spacing:1px;white-space:nowrap}
.wd::before{content:attr(data-t);position:absolute;left:0;right:0;top:5px;-webkit-text-stroke:14px #6b2d5c;color:#6b2d5c}
.wd b{position:relative;font-weight:800;background:linear-gradient(var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.wd.a{--g1:#ff9cc6;--g2:#f0388a}.wd.b{--g1:#7be9f0;--g2:#2a8bd6;font-size:78px;margin-top:-6px}

.note::before{content:"";position:absolute;left:8px;right:8px;top:-7px;height:14px;background:radial-gradient(circle at 9px 7px,#6f7684 0 4.5px,#0000 5.5px) 0 0/20px 14px repeat-x}
.note b{color:#e0307f}

.btn[lang=km],.btn.km{font-family:"Kantumruy Pro","Baloo 2",sans-serif;font-size:21px}
.tiny{font-size:12.5px;background:#fffaf0cc;border:2px solid #e9c9a8;border-radius:99px;padding:3px 14px;color:#6a4a5e}
#logo{width:300px;height:130px}
.receipt{position:relative;width:268px;background:#fffdf7;border-radius:6px 6px 0 0;padding:18px 20px 22px;box-shadow:0 8px 18px #7a3a2a44;font-family:"Courier New",monospace;color:#3b2a36;margin-bottom:8px}

.receipt .tot{font:800 54px "Baloo 2",sans-serif;color:#e0307f;line-height:1.05}
.receipt .why{font-family:"Kantumruy Pro",sans-serif;font-size:15px;font-weight:700;color:#6b2d5c}
