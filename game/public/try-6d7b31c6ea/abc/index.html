function texts(){document.documentElement.lang=LANG;$("tTitle").textContent=t("title");$("tSub").textContent=t("sub");$("stGo").textContent=t("go");$("dNext").textContent=t("next");$("dHome").textContent=t("home");
 $("lang").textContent=LANG==="km"?"English":"ខ្មែរ";$("bm").style.opacity=MUS?1:.45;$("bs").textContent=SND?"🔊":"🔇";$("st").textContent="⭐ "+STARS;
 $("worlds").innerHTML=WORLDS.map(function(w,i){return'<button class="w" data-i="'+i+'"><span class="e">'+w.e+'</span>'+(LANG==="km"?w.km:w.en)+'<small>'+(LANG==="km"?w.en:w.km)+'</small>'+(DONE.indexOf(w.id)>=0?'<span class="done">⭐</span>':'')+'</button>'}).join("")}
function menu(){mstart();G.w=null;theme(null);show("sMenu");texts()}
function openWorld(i){G.wi=i;G.w=WORLDS[i];theme(G.w);$("stM").textContent="🐵";$("stT").textContent=G.w.story[LANG];$("stE").textContent=G.w.e;show("sStory");$("stM").classList.remove("dance");void $("stM").offsetWidth;$("stM").classList.add("dance");sfx("tap")}
function startPlay(){var ws=shuffle(G.w.words);G.order=ws;G.r=0;G.rounds=[];for(var i=0;i<6;i++)G.rounds.push((i===2||i===5)&&ws[i][0].length<=6?"spell":"pick");nextRound()}
function bar(){var p=Math.round(G.r/6*100)+"%";$("bar").style.width=p;$("bar2").style.width=p}
function nextRound(){bar();if(G.r>=6)return finish();G.wrong=0;G.locked=false;G.target=G.order[G.r];
 if(G.rounds[G.r]==="spell")spellRound();else pickRound()}
function card(w,w0){var d=w[2];return /^\d$/.test(d)?'<span class="n">'+d+'</span><span class="cnt">'+Array(+d+1).join("⭐")+'</span>':d}
function pickRound(){show("sPlay");$("pB").textContent=t("find");$("pM").classList.remove("dance");
 var others=shuffle(G.w.words.filter(function(w){return w!==G.target})).slice(0,2),opts=shuffle([G.target].concat(others));
 $("opts").innerHTML=opts.map(function(w,i){return'<button class="opt" data-w="'+w[0]+'">'+card(w)+'</button>'}).join("");
 setTimeout(function(){say(G.target[0])},350)}
function good(){var g=pick(t("good"));return g}
function answerPick(el){if(G.locked)return;var w=el.getAttribute("data-w");
 if(w===G.target[0]){G.locked=true;el.classList.add("right");sfx("ok");STARS++;sv("ef_stars",STARS);$("st").textContent="⭐ "+STARS;$("pB").textContent=good()+" "+G.target[0]+" = "+G.target[1];
  $("pM").classList.remove("dance");void $("pM").offsetWidth;$("pM").classList.add("dance");setTimeout(function(){say(G.target[0])},300);setTimeout(function(){G.r++;nextRound()},1700)}
 else{G.wrong++;el.classList.remove("wrong");void el.offsetWidth;el.classList.add("wrong");sfx("no");$("pB").textContent=t("oops");setTimeout(function(){say(G.target[0])},450);
  if(G.wrong>=2){var all=$("opts").querySelectorAll(".opt");for(var i=0;i<all.length;i++)if(all[i].getAttribute("data-w")===G.target[0])all[i].classList.add("hint")}}}
function spellRound(){show("sSpell");var w=G.target[0].toUpperCase();G.spell={word:w,pos:0};$("spB").textContent=t("spell");$("spPic").innerHTML=card(G.target);$("spPic").style.fontSize=/^\d$/.test(G.target[2])?"72px":"96px";
 $("slots").innerHTML=w.split("").map(function(){return'<div class="slot"></div>'}).join("");
 var letters=shuffle(w.split(""));$("tiles").innerHTML=letters.map(function(l,i){return'<button class="tile" data-l="'+l+'" data-i="'+i+'">'+l+'</button>'}).join("");
 setTimeout(function(){say(G.target[0])},350)}
function answerTile(el){if(G.locked)return;var l=el.getAttribute("data-l"),S=G.spell;
 if(l===S.word.charAt(S.pos)){el.classList.add("used");var s=$("slots").children[S.pos];s.textContent=l;s.classList.add("on");S.pos++;sfx("tap");
  if(S.pos>=S.word.length){G.locked=true;sfx("ok");STARS++;sv("ef_stars",STARS);$("st").textContent="⭐ "+STARS;$("spB").textContent=good()+" "+G.target[0]+" = "+G.target[1];setTimeout(function(){say(G.target[0])},300);setTimeout(function(){G.r++;nextRound()},1800)}}
 else{el.classList.remove("wrong");void el.offsetWidth;el.classList.add("wrong");sfx("no");$("spB").textContent=t("oops")}}
function confetti(){var em=["🎉","⭐","🎈","✨","🍬"],w=$("wrap");for(var i=0;i<22;i++){var c=document.createElement("div");c.className="confetti";c.textContent=pick(em);c.style.left=Math.random()*100+"%";c.style.animationDelay=Math.random()*.8+"s";w.appendChild(c);(function(c){setTimeout(function(){c.remove()},3400)})(c)}}
function finish(){if(DONE.indexOf(G.w.id)<0){DONE.push(G.w.id);sv("ef_done",DONE)}show("sDone");$("dT").textContent=t("done");$("dB").textContent=t("learned");
 $("dS").textContent=DONE.map(function(id){return WORLDS.filter(function(w){return w.id===id})[0].e}).join(" ");$("dM").classList.remove("dance");void $("dM").offsetWidth;$("dM").classList.add("dance");$("st").textContent="⭐ "+STARS;sfx("win");confetti();
 $("dNext").textContent=G.wi<WORLDS.length-1?t("next"):t("again")}
/* ===== buttons ===== */
$("worlds").addEventListener("click",function(e){var b=e.target.closest(".w");if(b)openWorld(+b.getAttribute("data-i"))});
$("stGo").onclick=function(){sfx("tap");startPlay()};
$("opts").addEventListener("click",function(e){var b=e.target.closest(".opt");if(b)answerPick(b)});
$("tiles").addEventListener("click",function(e){var b=e.target.closest(".tile");if(b&&!b.classList.contains("used"))answerTile(b)});
$("again").onclick=$("again2").onclick=function(){if(G.target)say(G.target[0])};
$("dNext").onclick=function(){sfx("tap");if(G.wi<WORLDS.length-1)openWorld(G.wi+1);else menu()};
$("dHome").onclick=$("bhome").onclick=function(){sfx("tap");menu()};
$("bv").onclick=function(){sfx("tap");nextVoice()};
$("bm").onclick=function(){MUS=!MUS;sv("ef_mus",MUS);texts();if(MUS)mstart();else mstop();sfx("tap")};
$("bs").onclick=function(){SND=!SND;sv("ef_snd",SND);texts();if(!SND){try{speechSynthesis.cancel()}catch(e){}}else sfx("tap")};
$("lang").onclick=function(){LANG=LANG==="km"?"en":"km";sv("ef_lang",LANG);texts()};
window.EF={nextVoice:nextVoice,VOICES:function(){return VOICES},G:G,WORLDS:WORLDS,SPOKEN:SPOKEN,MU:MU,openWorld:openWorld,startPlay:startPlay,menu:menu};
texts();menu();
</script></body></html>
