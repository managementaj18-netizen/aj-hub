<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--sky1:#8fd8ff;--sky2:#e9f8ff;--hill1:#8fdc6a;--hill2:#62c24c;--m1:#b8d5ee;--m2:#9ccaa9;--ink:#2b3a67;--card:#fff;--shadow:#bcd7ee}
html,body{margin:0;height:100%;overflow:hidden;background:#cfeeff;font-family:"Baloo 2","Kantumruy Pro",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;color:var(--ink)}
#wrap{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 62%);transition:background .6s}
.toast{position:absolute;z-index:8;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#2b3a67;color:#fff;border-radius:99px;padding:6px 16px;font-size:14px;font-weight:700;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .3s;pointer-events:none}.toast.on{opacity:1}
.cloud{position:absolute;font-size:64px;opacity:.9;animation:drift linear infinite;will-change:transform}
.c1{top:12%;animation-duration:55s}.c2{top:26%;font-size:44px;animation-duration:80s;animation-delay:-30s}.c3{top:40%;font-size:54px;animation-duration:68s;animation-delay:-12s}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(640px)}}
.hill{position:absolute;left:-10%;right:-10%;border-radius:50% 50% 0 0;transition:background .6s}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.sun{position:absolute;z-index:1;top:calc(74px + env(safe-area-inset-top));right:16px;width:74px;height:74px;pointer-events:none}.sun svg{width:100%;height:100%}.sun .rays{transform-origin:50% 50%;animation:spin 40s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.fly{position:absolute;z-index:1;pointer-events:none;font-size:26px;will-change:transform}
.bird{top:19%;left:-40px;animation:cross 26s linear infinite}.bird.b2{top:30%;font-size:20px;animation-duration:38s;animation-delay:-14s}
@keyframes cross{from{transform:translateX(0) translateY(0)}25%{transform:translateX(150px) translateY(-14px)}50%{transform:translateX(300px) translateY(6px)}75%{transform:translateX(450px) translateY(-10px)}to{transform:translateX(640px) translateY(0)}}
.bf{bottom:19%;left:12%;animation:flutter 9s ease-in-out infinite}.bf.f2{bottom:24%;left:68%;font-size:22px;animation-duration:12s;animation-delay:-5s}
@keyframes flutter{0%,100%{transform:translate(0,0) rotate(-8deg)}20%{transform:translate(50px,-30px) rotate(10deg)}45%{transform:translate(110px,-8px) rotate(-6deg)}70%{transform:translate(40px,-44px) rotate(8deg)}}
.scene{position:absolute;left:0;bottom:0;width:100%;height:auto;max-height:46%;pointer-events:none;z-index:1}
#hud{position:absolute;z-index:5;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:center}
#hud .pill{background:#ffffffdd;border-radius:99px;padding:4px 14px;font-weight:800;font-size:20px}
#hud .sp{flex:1}.btn{border:0;background:#ffffffdd;border-radius:99px;width:46px;height:46px;font-size:22px;cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.screen{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;padding:calc(70px + env(safe-area-inset-top)) 16px 24px;gap:14px;text-align:center}
.screen.hide{display:none}
.screen:not(.hide){animation:fadein .4s ease both}@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.opt{animation:rise .45s cubic-bezier(.2,.9,.3,1.2) both}.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
.next{animation:rise .4s ease both}.next.hide{display:none}
h1{margin:0;font-size:32px;line-height:1.1}
.sub{font-size:16px;opacity:.8;margin:0}
.worlds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:400px}
.w{border:0;border-radius:26px;background:var(--card);padding:16px 8px 12px;font:800 18px "Baloo 2","Kantumruy Pro",sans-serif;color:var(--ink);box-shadow:0 7px 0 var(--shadow);cursor:pointer;position:relative}
.w:active{transform:translateY(5px);box-shadow:0 2px 0 var(--shadow)}
.w .e{font-size:50px;display:block;line-height:1.1}.w small{display:block;font-weight:600;font-size:13px;opacity:.7}
.w .done{position:absolute;top:6px;right:10px;font-size:22px}
.mascot{font-size:92px;line-height:1;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 8px 0 #0001)}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.dance{animation:dance .7s ease both}
@keyframes dance{0%,100%{transform:none}25%{transform:translateY(-28px) rotate(-12deg)}50%{transform:translateY(0) rotate(10deg) scale(1.12)}75%{transform:translateY(-16px) rotate(-6deg)}}
.bubble{background:#fff;border-radius:22px;padding:10px 18px;font-weight:800;font-size:22px;box-shadow:0 5px 0 var(--shadow);max-width:340px;min-height:50px}
.big{border:0;border-radius:22px;background:#ffb703;color:#4a3000;font:800 24px "Baloo 2","Kantumruy Pro",sans-serif;padding:12px 36px;cursor:pointer;box-shadow:0 6px 0 #c98a00}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c98a00}
#lang{display:none!important}.sm{border:0;border-radius:99px;background:#ffffffaa;color:var(--ink);font:700 15px "Baloo 2","Kantumruy Pro",sans-serif;padding:8px 18px;cursor:pointer}
.say{border:0;border-radius:99px;background:#fff;font-size:34px;width:70px;height:70px;cursor:pointer;box-shadow:0 5px 0 var(--shadow)}
.say:active{transform:translateY(3px)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:420px;margin-top:6px}
.opt{border:0;border-radius:26px;background:#fff;aspect-ratio:1;font-size:64px;line-height:1;box-shadow:0 7px 0 var(--shadow);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s}
.opt:active{transform:translateY(5px);box-shadow:0 2px 0 var(--shadow)}
.opt svg{width:84%;height:84%}.opts.lab .opt svg{width:62%;height:62%}.opts.lab .opt{font-size:50px}.opt .lab{font:800 22px "Baloo 2",sans-serif;margin-top:2px;color:#2b3a67}.pic svg{width:120px;height:120px}.opt .n{font-size:46px;font-weight:800;color:#e0457b}.opt .cnt{font-size:14px;letter-spacing:1px}
.opt.right{background:#c9f7c4;animation:pop .5s ease}.opt.wrong{animation:shake .4s ease}.opt.hint{animation:pulse .8s ease 3}
@keyframes pop{50%{transform:scale(1.18)}}@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}@keyframes pulse{50%{transform:scale(1.1);background:#fff3c4}}
.pic{font-size:96px;line-height:1}.word{font-size:46px;font-weight:800;letter-spacing:2px}.km{font-size:20px;opacity:.75;font-weight:700}
.slots,.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:420px}
.slot{width:52px;height:62px;border-radius:14px;background:#ffffffaa;border:3px dashed #8fb3d6;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800}
.slot.on{background:#fff;border:3px solid #62c24c}
.tile{width:60px;height:66px;border:0;border-radius:16px;background:#fff;font:800 36px "Baloo 2",sans-serif;color:var(--ink);box-shadow:0 6px 0 var(--shadow);cursor:pointer}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}.tile.used{visibility:hidden}.tile.wrong{animation:shake .4s ease;background:#ffe0e0}
.bar{width:100%;max-width:300px;height:14px;border-radius:99px;background:#ffffff99;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#ffb703;border-radius:99px;transition:width .4s}
.stickers{font-size:46px;letter-spacing:6px}
.confetti{position:absolute;top:-20px;font-size:26px;animation:fall 2.4s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.cloud,.mascot,.screen,.opt,.next,.sw,.sun .rays,.fly{animation:none!important}}
</style></head><body>
