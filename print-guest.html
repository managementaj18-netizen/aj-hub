<!doctype html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A&J · Guest print sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#eceae6;color:#161616;font-family:"Kantumruy Pro",system-ui,sans-serif;font-size:14px;line-height:1.45}
.controls{max-width:820px;margin:0 auto;padding:16px}
.controls h1{font-size:18px;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:#555;gap:3px}
input{font:inherit;padding:10px 12px;border:1px solid #cfcdc8;border-radius:10px;min-width:140px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 18px;background:#161616;color:#fff;cursor:pointer}
button.alt{background:#fff;color:#161616;border:1px solid #cfcdc8}
#msg{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fdf2dc;display:none}
#msg.ok{background:#e3f4e8}
.sheet{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:14mm;box-shadow:0 2px 12px #0002;page-break-after:always;break-after:page}
.sheet:last-child{page-break-after:auto;break-after:auto}
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #161616;padding-bottom:8px;margin-bottom:12px}
.hd b{font-size:20px;letter-spacing:.5px}.hd span{font-size:12px;color:#555}
h2{font-size:20px;margin:0 0 10px}
.photos{display:grid;gap:8px;margin-bottom:12px}
.photos img{width:100%;max-height:105mm;object-fit:contain;border:1px solid #ddd;border-radius:6px;background:#fafafa}
.photos.two{grid-template-columns:1fr 1fr}.photos.two img{max-height:80mm}
table{width:100%;border-collapse:collapse}
td{padding:6px 8px;border-bottom:1px solid #e3e1dc;vertical-align:top}
td:first-child{width:38%;color:#555}
td:last-child{font-weight:600}
.ft{margin-top:14px;font-size:11px;color:#777;display:flex;justify-content:space-between}
@media print{
  body{background:#fff}.controls,#msg{display:none!important}
  .sheet{margin:0;box-shadow:none;width:auto;min-height:0;padding:0}
  @page{size:A4;margin:12mm}
}
</style></head><body>
<div class="controls">
  <h1>🖨️ បោះពុម្ពព័ត៌មានភ្ញៀវ · Guest print sheet</h1>
  <div class="row">
    <label>លេខបន្ទប់ · Room<input id="room" inputmode="text" placeholder="205"></label>
    <label>ថ្ងៃ · Date (ទទេ = ថ្ងៃនេះ)<input id="date" type="date"></label>
    <button id="go">ស្វែងរក · Find</button>
    <button id="print" class="alt" style="display:none">🖨️ បោះពុម្ព / PDF</button>
  </div>
  <div id="msg"></div>
</div>
<div id="out"></div>
<script>
(function () {
  "use strict";
  var PRINT = "https://aj-kampot-print.pages.dev/api/", LS = "aj_scankey";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function msg(t, ok) { var m = $("msg"); m.textContent = t || ""; m.style.display = t ? "block" : "none"; m.className = ok ? "ok" : ""; }
  function key() { try { return localStorage.getItem(LS) || ""; } catch (e) { return ""; } }
  function askKey() {
    var v = prompt("ដាក់ Staff link ឬ Scan key ពី Passport Scan › Settings (ម្តងគត់)\nPaste the Staff link or Scan key from Passport Scan › Settings", "");
    if (!v) return "";
    v = v.trim(); var m = v.match(/[?&](?:scankey|k)=([\w-]+)/); if (m) v = m[1];
    if (!/^[\w-]{6,}$/.test(v)) { alert("Key មិនត្រឹមត្រូវ · Invalid"); return ""; }
    try { localStorage.setItem(LS, v); } catch (e) {}
    return v;
  }
  function fmtD(d) { if (!d) return ""; var m = String(d).slice(0, 10).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3] + "/" + m[2] + "/" + m[1] : d; }
  function first(g, names) { for (var i = 0; i < names.length; i++) if (g[names[i]]) return g[names[i]]; return ""; }
  var ROWS = [
    ["ឈ្មោះខ្មែរ · Khmer name", ["name_km", "khmer_name", "name_kh"]],
    ["Passport / ID No.", ["passport_no", "id_no"]],
    ["Nationality · សញ្ជាតិ", ["country", "nationality_name", "nationality"]],
    ["Sex · ភេទ", ["sex"]],
    ["Date of birth · ថ្ងៃកំណើត", ["dob"], 1],
    ["Place of birth · ទីកន្លែងកំណើត", ["pob", "place_of_birth"]],
    ["Address · អាសយដ្ឋាន", ["address"]],
    ["Passport expiry · ផុតកំណត់", ["expiry"], 1],
    ["Issued by · ចេញដោយ", ["issuing_country_name", "issuing_country"]],
    ["Visa type · ប្រភេទវីសា", ["visa_type"]],
    ["Visa No.", ["visa_no"]],
    ["Visa valid until · វីសាផុតកំណត់", ["visa_valid_until", "visa_expiry", "visa_valid"], 1],
    ["Room · បន្ទប់", ["room"]],
    ["Check-in · ថ្ងៃចូល", ["checkin_date"], 1],
    ["Check-out · ថ្ងៃចេញ", ["checkout_date"], 1],
    ["Phone · ទូរស័ព្ទ", ["phone"]]
  ];
  function sheet(g, imgs) {
    var name = [g.given_names, g.surname].filter(Boolean).join(" ").trim() || g.name || "—";
    var rows = ROWS.map(function (r) { var v = first(g, r[1]); if (r[2]) v = fmtD(v); return v ? "<tr><td>" + esc(r[0]) + "</td><td>" + esc(v) + "</td></tr>" : ""; }).join("");
    var ph = imgs.length ? '<div class="photos' + (imgs.length === 2 ? " two" : "") + '">' + imgs.map(function (u) { return '<img src="' + u + '" alt="">'; }).join("") + "</div>" : "";
    return '<section class="sheet"><div class="hd"><b>A&amp;J Kampot Boutique</b><span>Guest registration · ព័ត៌មានភ្ញៀវ</span></div><h2>' + esc(name) + "</h2>" + ph + "<table>" + rows + '</table><div class="ft"><span>Printed ' + esc(new Date().toLocaleString("en-GB")) + "</span><span>A&amp;J Passport Scan</span></div></section>";
  }
  function toDataUrl(blob) { return new Promise(function (res) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = function () { res(""); }; r.readAsDataURL(blob); }); }
  /* same logic as the Hub check-in form: split the stacked photo into separate pictures (removes the black label bars) */
  function splitStack(blob) {
    return new Promise(function (res) {
      var url = URL.createObjectURL(blob), img = new Image();
      img.onerror = function () { toDataUrl(blob).then(function (u) { res(u ? [u] : []); }); };
      img.onload = function () {
        try {
          var W = img.naturalWidth, H = img.naturalHeight, c = document.createElement("canvas");
          c.width = W; c.height = H; var x = c.getContext("2d"); x.drawImage(img, 0, 0); URL.revokeObjectURL(url);
          var d = x.getImageData(0, 0, W, H).data;
          var rowMean = function (y) { var s = 0, n = 0; for (var i = y * W * 4; i < (y + 1) * W * 4; i += 16) { s += d[i] + d[i + 1] + d[i + 2]; n++; } return s / n / 3; };
          var bands = [], st = -1, y;
          for (y = 0; y < H; y++) { var dark = rowMean(y) < 25; if (dark && st < 0) st = y; if (!dark && st >= 0) { if (y - st >= 6) bands.push([st, y]); st = -1; } }
          if (st >= 0) bands.push([st, H]);
          var heads = [];
          bands.forEach(function (b) { var l = heads[heads.length - 1]; if (l && b[0] - l[1] <= 22) l[1] = b[1]; else heads.push([b[0], b[1]]); });
          var segs = [], prev = 0;
          heads.forEach(function (h) { if (h[0] - prev > 150) segs.push([prev, h[0]]); prev = h[1]; });
          if (H - prev > 150) segs.push([prev, H]);
          if (segs.length < 1) segs = [[0, H]];
          res(segs.map(function (sg) {
            var h = sg[1] - sg[0], x0 = 0, x1 = W;
            var colMean = function (cx) { var s = 0, n = 0; for (var yy = sg[0]; yy < sg[1]; yy += 4) { var i = (yy * W + cx) * 4; s += d[i] + d[i + 1] + d[i + 2]; n++; } return s / n / 3; };
            while (x0 < W - 50 && colMean(x0) < 20) x0 += 2;
            while (x1 > x0 + 50 && colMean(x1 - 1) < 20) x1 -= 2;
            var o = document.createElement("canvas"); o.width = x1 - x0; o.height = h;
            o.getContext("2d").drawImage(c, x0, sg[0], x1 - x0, h, 0, 0, x1 - x0, h);
            return o.toDataURL("image/jpeg", 0.85);
          }));
        } catch (e) { toDataUrl(blob).then(function (u) { res(u ? [u] : []); }); }
      };
      img.src = url;
    });
  }
  function find() {
    var room = $("room").value.trim().replace(/^room\s*/i, ""), date = $("date").value;
    if (!room) return msg("សូមដាក់លេខបន្ទប់ · Enter the room number");
    var k = key() || askKey(); if (!k) return msg("ត្រូវការ Key ពី Passport Scan › Settings · A key is needed");
    msg("កំពុងស្វែងរក… · Searching…", true); $("out").innerHTML = ""; $("print").style.display = "none";
    fetch(PRINT + "hub_room?key=" + encodeURIComponent(k) + "&room=" + encodeURIComponent(room) + (date ? "&date=" + date : ""), { credentials: "omit" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { if (/key/i.test(j.error || "")) { try { localStorage.removeItem(LS); } catch (e) {} } throw new Error(j.error === "Bad key" ? "Key ចាស់ ឬខុស — ដាក់ Key ថ្មី · Wrong key, try again" : (j.error || "Error")); }
        var G = j.guests || [];
        if (!G.length) throw new Error("រកមិនឃើញភ្ញៀវបន្ទប់ " + room + (date ? " ថ្ងៃ " + fmtD(date) : " ថ្ងៃនេះ") + " · No guest found (try another date)");
        return Promise.all(G.map(function (g) {
          if (g.has_img != 1) return { g: g, imgs: [] };
          return fetch(PRINT + "hub_img?key=" + encodeURIComponent(k) + "&id=" + g.id, { credentials: "omit" })
            .then(function (r) { return r.ok ? r.blob() : null; })
            .then(function (b) { return b ? splitStack(b) : []; })
            .catch(function () { return []; })
            .then(function (imgs) { return { g: g, imgs: imgs }; });
        }));
      })
      .then(function (list) {
        $("out").innerHTML = list.map(function (it) { return sheet(it.g, it.imgs); }).join("");
        $("print").style.display = ""; msg("✅ រកឃើញ " + list.length + " នាក់ — ពិនិត្យ រួចចុច 🖨️ · Found " + list.length + " — check, then print", true);
      })
      .catch(function (e) { msg("⚠️ " + e.message); });
  }
  $("go").onclick = find; $("room").onkeydown = function (e) { if (e.key === "Enter") find(); };
  $("print").onclick = function () { window.print(); };
  var q = new URLSearchParams(location.search).get("room"); if (q) { $("room").value = q; find(); }
})();
</script></body></html>
